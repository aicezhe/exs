<script>
(() => {
'use strict';

/* Numbers from the notebook go here. The clips below are synthetic (a seeded generator):
   they only show how the split works. */
const N_CLIPS = 72;
const SPEAKERS = ['anna', 'bob', 'carl'];
const CLASSES = ['telegram', 'elly', 'slack', 'focus', 'noise', 'unknown'];
const TEST_SIZE = 0.15;     // share of clips for test in the random split
const VAL_SIZE = 0.15;      // share of trainval for val
const LETTERS = CLASSES.map(c => c[0]);
const TILE_W = 22, TILE_N = 18, GAP = 4, PADZ = 10, TITLEH = 24;

const CAPTIONS = [
  'Every row of the table df is one clip.',
  'The test set is one whole person the model never hears.',
  'val is cut from the same speakers as train, so it is easier than test. It only decides when to stop training.',
  'mean and std come from train only. val and test use the same numbers, so nothing leaks from test into training.',
];
const CAP_RANDOM = 'Same voice in train and test: the model can learn the voice, not the word.';
const NOTE_STRAT = 'stratify keeps the class proportions in both parts.';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const ease = u => 1 - Math.pow(1 - u, 3);

/* ---------- synthetic clips: a speaker, a class and one feature value ---------- */
function makeRng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rng = makeRng(2026);
const gauss = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(6.283185 * rng());
const pickW = w => { let r = rng() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) return i; } return w.length - 1; };
const SPK_WEIGHT = [.36, .34, .30], SPK_OFFSET = [3.4, 5.0, 3.9], CLS_OFFSET = [0, .3, -.3, .2, -.4, .1];
const CLS_WEIGHT = { bob: [1, 1, 1, 0, 1, 1], carl: [1, 0, 1, 1, 1, 1] };   // bob never says "focus", carl never says "elly"
const CLIPS = Array.from({ length: N_CLIPS }, (_, id) => {
  const s = pickW(SPEAKERS.map((_, i) => SPK_WEIGHT[i] || 1)), c = pickW(CLS_WEIGHT[SPEAKERS[s]] || CLASSES.map(() => 1));
  return { id, s, c, feat: (SPK_OFFSET[s] || 4) + CLS_OFFSET[c] + gauss() * 1.3 };
});
const shuffled = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const ORDER = shuffled(CLIPS.map(c => c.id));   // one fixed random order, so toggling does not reshuffle everything

const TEST_N = Math.ceil(TEST_SIZE * N_CLIPS);
const RANDOM_TEST = (() => {   // a few clips of every speaker, so the same voice is on both sides
  const chosen = new Set();
  SPEAKERS.forEach((_, s) => ORDER.filter(id => CLIPS[id].s === s).slice(0, 2).forEach(id => chosen.add(id)));
  ORDER.forEach(id => { if (chosen.size < TEST_N) chosen.add(id); });
  return chosen;
})();

/* ---------- the split: state -> a zone for every clip ---------- */
const S = { mode: 'speaker', held: Math.max(0, SPEAKERS.indexOf('bob')), strat: true };
let SP = null;

function computeSplit() {
  const zone = CLIPS.map(() => 'train');
  CLIPS.forEach(c => { if (S.mode === 'speaker' ? c.s === S.held : RANDOM_TEST.has(c.id)) zone[c.id] = 'test'; });
  const tv = CLIPS.filter(c => zone[c.id] !== 'test'), nVal = Math.max(1, Math.ceil(VAL_SIZE * tv.length));
  const val = new Set();
  if (S.strat) {   // proportional share per class; every class with 2+ clips keeps at least one in val
    const cnt = CLASSES.map((_, c) => tv.filter(x => x.c === c).length), q = cnt.map(n => nVal * n / tv.length);
    const al = q.map((v, c) => cnt[c] >= 2 ? Math.max(1, Math.floor(v)) : Math.floor(v));
    let sum = al.reduce((a, b) => a + b, 0);
    while (sum < nVal) { let b = -1; q.forEach((v, c) => { if (al[c] < cnt[c] && (b < 0 || v - al[c] > q[b] - al[b])) b = c; }); if (b < 0) break; al[b]++; sum++; }
    while (sum > nVal) { let b = -1; q.forEach((v, c) => { if (al[c] > 1 && (b < 0 || v - al[c] < q[b] - al[b])) b = c; }); if (b < 0) break; al[b]--; sum--; }
    CLASSES.forEach((_, c) => ORDER.filter(id => CLIPS[id].c === c && zone[id] !== 'test').slice(0, al[c]).forEach(id => val.add(id)));
  } else {
    // plain random cut; the first draw that leaves a class out of val is used, so the effect is visible
    const pool = ORDER.filter(id => zone[id] !== 'test');
    let cut = pool.slice(0, nVal);
    for (let k = 0; k + nVal <= pool.length; k++) {
      const cand = pool.slice(k, k + nVal);
      if (CLASSES.some((_, c) => tv.some(x => x.c === c) && !cand.some(id => CLIPS[id].c === c))) { cut = cand; break; }
    }
    cut.forEach(id => val.add(id));
  }
  val.forEach(id => { zone[id] = 'val'; });
  const n = { train: 0, val: 0, test: 0 }, cc = { train: CLASSES.map(() => 0), val: CLASSES.map(() => 0), test: CLASSES.map(() => 0) };
  CLIPS.forEach(c => { n[zone[c.id]]++; cc[zone[c.id]][c.c]++; });
  const tvCount = CLASSES.map((_, c) => cc.train[c] + cc.val[c]);
  const missingVal = CLASSES.map((_, c) => c).filter(c => tvCount[c] > 0 && cc.val[c] === 0);
  const missingTest = CLASSES.map((_, c) => c).filter(c => cc.test[c] === 0);
  return { zone, n, cc, tvCount, missingVal, missingTest };
}
// the biggest number of tiles a zone can ever hold, so zones keep their size when the choice changes
const WORST = (() => {
  const w = { tv: 0, train: 0, val: 0, test: 0 };
  [...SPEAKERS.map((_, s) => CLIPS.filter(c => c.s === s).length), TEST_N].forEach(t => {
    const tv = N_CLIPS - t, v = Math.ceil(VAL_SIZE * tv);
    w.tv = Math.max(w.tv, tv); w.train = Math.max(w.train, tv - v); w.val = Math.max(w.val, v); w.test = Math.max(w.test, t);
  });
  return w;
})();

const f2 = v => (Math.abs(v) < .005 ? 0 : v).toFixed(2);
const statsOf = v => { const m = v.reduce((a, b) => a + b, 0) / (v.length || 1); return { mean: m, std: Math.sqrt(v.reduce((a, b) => a + (b - m) * (b - m), 0) / (v.length || 1)) || 1 }; };
const trainStats = () => statsOf(CLIPS.filter(c => SP.zone[c.id] === 'train').map(c => c.feat));   // train only, like the notebook

/* ---------- setup ---------- */
const cv = $('c'), ctx = cv.getContext('2d');
const card = $('card'), hudEl = $('hud'), capEl = $('cap'), toolsEl = $('tools'), chipsEl = $('chips');
const prevBtn = $('prev'), nextBtn = $('next'), modeBtn = $('mode'), stratBtn = $('strat'), replayBtn = $('replay'), onwardEl = $('onward');
const dots = [...document.querySelectorAll('#dots i')];
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = THEME.mono;
const SPK_COL = [THEME.neon, THEME.ink, THEME.gray], SPK_VAR = ['--neon', '--ink', '--gray'];
const spkCol = s => SPK_COL[s % SPK_COL.length];

let W = 0, H = 0, DPR = 0, narrow = false, fs = 14.5, TILE = TILE_W, step = 0, stepT0 = 0, now = 0, sel = null;
const L = {};
const A = [1, 0, 0, 0];

const TILES = CLIPS.map((c, i) => ({ c, i, x: 0, y: 0, fx: 0, fy: 0, tx: 0, ty: 0, a: 1, fa: 1, ta: 1, t0: 0, dur: 0, cx: 0, cy: 0, ph: rng() * 6.28 }));

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function T(t, x, y, col, size, align = 'left', a = 1, weight = 400) {
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${MONO}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y); ctx.globalAlpha = 1;
}
function fitSize(t, maxW, size) { ctx.font = `${size}px ${MONO}`; const w = ctx.measureText(t).width; return w > maxW ? Math.max(9, size * maxW / w) : size; }
function fitCode(t, x, cy, maxW, col, a) {
  const sz = fitSize(t, maxW - 16, fs - 1); ctx.font = `${sz}px ${MONO}`; const w = Math.min(maxW, ctx.measureText(t).width + 16);
  ctx.globalAlpha = a; rr(x, cy - 11, w, 22, 6); ctx.fillStyle = THEME.codeBg; ctx.fill(); ctx.globalAlpha = 1;
  T(t, x + 8, cy, col, sz, 'left', a);
}
const note = (x, y, align, a) => T('illustrative data', x, y, THEME.muted, Math.max(10, fs * .78), align, a);

/* ---------- layout ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (innerWidth === W && innerHeight === H && dpr === DPR) return;
  W = innerWidth; H = innerHeight; DPR = dpr;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const colsOf = w => Math.max(1, Math.floor((w - 2 * PADZ + GAP) / (TILE + GAP)));
const needH = (k, w) => TITLEH + Math.max(1, Math.ceil(WORST[k] / colsOf(w))) * (TILE + GAP) - GAP + PADZ;
// zones side by side on a wide screen, stacked on a narrow one: {key: {x, y, w, h, cols}}, and the bottom edge
function zonesAt(keys, fr, y) {
  const gap = narrow ? 8 : 24, out = {}; let bottom = y;
  if (narrow) {
    keys.forEach(k => { const h = needH(k, L.cw); out[k] = { x: L.x0, y: bottom, w: L.cw, h, cols: colsOf(L.cw) }; bottom += h + gap; });
    bottom -= gap;
  } else {
    const avail = L.cw - gap * (keys.length - 1); let x = L.x0, h = 0;
    keys.forEach((k, i) => { h = Math.max(h, needH(k, avail * fr[i]), 150); });
    keys.forEach((k, i) => { const w = avail * fr[i]; out[k] = { x, y, w, h, cols: colsOf(w) }; x += w + gap; });
    bottom = y + h;
  }
  return { z: out, bottom };
}
function layout() {
  resize();
  narrow = W < 700; fs = narrow ? 12.5 : 14.5; TILE = narrow ? TILE_N : TILE_W;
  const hudB = hudEl.getBoundingClientRect().bottom, capTop = capEl.getBoundingClientRect().top;
  toolsEl.style.bottom = (H - capTop + 8) + 'px';
  const pad = narrow ? 16 : 32, cw = Math.min(W - 2 * pad, 1100), x0 = (W - cw) / 2, y0 = hudB + 10;
  const y1 = capTop - 8 - 38 - 8, ln = narrow ? 18 : 22;
  Object.assign(L, { pad, cw, x0, y0, y1, ln, capTop });
  // step 1: the cloud (and a legend to its left on a wide screen)
  const lg = narrow ? 3 * 22 + 8 : 0, cl = { x0: narrow ? x0 : x0 + 250, x1: x0 + cw, y0: y0 + lg, y1: capTop - 12 };
  cl.cx = (cl.x0 + cl.x1) / 2; cl.cy = (cl.y0 + cl.y1) / 2; cl.rx = Math.max(60, (cl.x1 - cl.x0) / 2 - TILE); cl.ry = Math.max(60, Math.min((cl.y1 - cl.y0) / 2 - TILE, 230));
  L.cloud = cl;
  // step 2: chips, two code lines, zones, counters
  const top1 = y0 + (narrow ? 4 : 0);
  L.g1 = { codeY: top1 + 46 }; const z1 = zonesAt(['tv', 'test'], [.64, .36], top1 + 46 + 2 * ln + 10);
  L.g1.zones = z1.z; L.g1.cy = z1.bottom + 16;
  chipsEl.style.top = top1 + 'px';
  // step 3: code line, zones, bars, note, print line
  L.g2 = { codeY: y0 }; const z2 = zonesAt(['train', 'val', 'test'], [.5, .2, .3], y0 + ln + 8);
  L.g2.zones = z2.z; L.g2.barsLabelY = z2.bottom + 14; L.g2.barH = narrow ? 30 : 40; L.g2.barsY = L.g2.barsLabelY + 8;
  L.g2.noteY = L.g2.barsY + L.g2.barH + 32; L.g2.printY = L.g2.noteY + 16;
}

/* ---------- where every tile goes ---------- */
const zoneKey = t => step === 1 ? (SP.zone[t.c.id] === 'test' ? 'test' : 'tv') : SP.zone[t.c.id];
function targets() {
  const zs = step === 1 ? L.g1.zones : step === 2 ? L.g2.zones : null;
  TILES.forEach(t => { t.tz = null; });
  if (!zs) return;
  Object.keys(zs).forEach(k => {
    const z = zs[k], list = TILES.filter(t => zoneKey(t) === k).sort((a, b) => a.c.s - b.c.s || a.c.c - b.c.c || a.c.id - b.c.id);
    list.forEach((t, i) => { t.tz = k; t.sx = z.x + PADZ + TILE / 2 + (i % z.cols) * (TILE + GAP); t.sy = z.y + TITLEH + TILE / 2 + Math.floor(i / z.cols) * (TILE + GAP); });
  });
}
function initCloud() {
  const c = L.cloud;
  TILES.forEach((t, i) => {
    const r = Math.sqrt((i + .5) / TILES.length), an = i * 2.39996;
    t.cx = c.cx + Math.cos(an) * r * c.rx; t.cy = c.cy + Math.sin(an) * r * c.ry;
  });
}
function arrange(instant) {
  targets();
  TILES.forEach((t, i) => {
    const cx = t.cx, cy = t.cy;
    const tx = step === 0 ? cx : (step === 3 ? cx : t.sx), ty = step === 0 ? cy : (step === 3 ? cy : t.sy);
    t.fx = t.x; t.fy = t.y; t.fa = t.a; t.tx = tx; t.ty = ty; t.ta = step === 3 ? 0 : 1;
    t.dur = instant || reduce ? 0 : 520; t.t0 = performance.now() + (instant || reduce ? 0 : (i * 37 % 72) * 7);
  });
}

/* ---------- drawing ---------- */
function drawTile(t, hl, dim) {
  if (t.a < .02) return;

function drawS1(a) {

function drawBars(a) {

  if (warn) T(`! no clips of class ${SP.missingVal.map(c => LETTERS[c]).join(', ')} in val`, L.x0 + L.cw / 2, g.noteY + 16, THEME.neon, fitSize('! no clips of class x in val', L.cw, sm + 1), 'center', a, 700);

// step 4: one feature as three histograms; train is standardized first, then val and test with the same numbers
const BIN = .5, HIST = { train: {}, val: {}, test: {} };
function histData() {
  const ts = trainStats(); L.ts = ts;
  const all = CLIPS.map(c => c.feat), lo = Math.floor(Math.min(...all, -3.5) / BIN) * BIN - BIN, hi = Math.ceil(Math.max(...all, 3.5) / BIN) * BIN + BIN;
  L.lo = lo; L.hi = hi; const nb = Math.round((hi - lo) / BIN); let peak = 0;

    const v = CLIPS.filter(c => SP.zone[c.id] === k).map(c => c.feat), bins = new Array(nb).fill(0);
    v.forEach(x => { bins[clamp(Math.floor((x - lo) / BIN), 0, nb - 1)]++; });
    HIST[k].raw = v; HIST[k].d = bins.map(n => n / (Math.max(1, v.length) * BIN)); peak = Math.max(peak, ...HIST[k].d);
  });

}
function drawS3(a) {
  const x0 = L.x0 + 4, w = L.cw - 8, sm = Math.max(10, fs * .8), keys = ['train', 'val', 'test'], ts = L.ts;
  const top = L.y0 + 24, hh = (L.y1 - 20 - top) / 3;

    T(`${k} · ${HIST[k].raw.length}`, x0 + 6, rt + 12, k === 'test' ? THEME.neon : THEME.ink, sm + 1, 'left', a, 700);

    T(`mean ${f2(st.mean)} · std ${f2(st.std)}`, x0 + w - 6, rt + 12, t > .5 ? THEME.link : THEME.gray, sm, 'right', a);
    ctx.globalAlpha = a * .5; ctx.strokeStyle = THEME.muted; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, base); ctx.lineTo(x0 + w, base); ctx.stroke();
    ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(px(0), plotTop - 2); ctx.lineTo(px(0), base); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    for (let u = Math.ceil((L.lo + .6) / 2) * 2; u <= L.hi - .6; u += 2) T(String(u), px(u), base + 8, THEME.muted, sm - 1, 'center', a);

/* ---------- card for a tapped / hovered tile ---------- */
const pointer = { x: 0, y: 0, type: 'mouse', inside: false };
function pick() {
  let best = null, bd = (TILE / 2 + 5) ** 2;
  TILES.forEach(t => { if (t.a < .5) return; const d = (t.x - pointer.x) ** 2 + (t.y - pointer.y) ** 2; if (d < bd) { bd = d; best = t; } });
  return best;
}
function showCard(t) {

  const c = t.c, z = step === 0 ? 'not split yet' : zoneKey(t);
  card.className = 'on' + (c.s === 1 ? ' quiet' : ''); card.style.left = clamp(t.x + 24, 12, W - 380) + 'px'; card.style.top = clamp(t.y - 10, L.y0, H - 260) + 'px';
  card.innerHTML = `<span class="tag">${SPEAKERS[c.s]}</span><h2>${CLASSES[c.c]}</h2><code>df.iloc[${c.id}]</code><p>Clip ${c.id}: spoken by ${SPEAKERS[c.s]}, class “${CLASSES[c.c]}”. Where it goes: ${z}.</p>`;
}

/* ---------- loop ---------- */
let last = 0;
function frame(ts) {
  const t = ts / 1000, dt = Math.min(.05, last ? t - last : .016); last = t; now = performance.now();
  const k = reduce ? 1 : Math.min(1, dt * 7);
  for (let i = 0; i < 4; i++) A[i] += ((i === step ? 1 : 0) - A[i]) * k;
  TILES.forEach(tl => {
    const u = tl.dur === 0 ? 1 : clamp((now - tl.t0) / tl.dur, 0, 1), e = ease(u);
    let tx = tl.tx, ty = tl.ty;
    if (step === 0 && !reduce) { tx += Math.sin(t * .7 + tl.ph) * 6; ty += Math.cos(t * .6 + tl.ph * 1.3) * 6; }
    tl.x = mix(tl.fx, tx, e); tl.y = mix(tl.fy, ty, e); tl.a = mix(tl.fa, tl.ta, e);
  });
  const hov = pointer.type === 'mouse' ? (pointer.inside ? pick() : null) : sel;
  ctx.clearRect(0, 0, W, H);
  if (A[0] > .01) drawLegend(A[0]);
  if (A[1] > .01) drawS1(A[1]);
  if (A[2] > .01) drawS2(A[2]);
  if (A[3] > .01) drawS3(A[3]);
  TILES.forEach(tl => drawTile(tl, tl === hov, hov && tl !== hov ? .45 : 1));
  cv.style.cursor = hov ? 'pointer' : 'default';
  showCard(hov);
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
function syncUI() {
  dots.forEach((d, i) => d.classList.toggle('on', i === step));
  prevBtn.disabled = step === 0; nextBtn.hidden = step === 3; onwardEl.hidden = step !== 3;
  capEl.textContent = step === 1 && S.mode === 'random' ? CAP_RANDOM : CAPTIONS[step];
  chipsEl.classList.toggle('on', step === 1);
  toolsEl.classList.toggle('on', step === 1 || step === 2 || step === 3);
  modeBtn.hidden = step !== 1; stratBtn.hidden = step !== 2; replayBtn.hidden = step !== 3;
  modeBtn.textContent = S.mode === 'speaker' ? 'Random split instead' : 'Held-out speaker instead';
  modeBtn.setAttribute('aria-pressed', String(S.mode === 'random'));
  stratBtn.textContent = `stratify: ${S.strat ? 'ON' : 'OFF'}`; stratBtn.setAttribute('aria-pressed', String(S.strat));
  chipsEl.querySelectorAll('button').forEach((b, i) => { b.setAttribute('aria-pressed', String(S.mode === 'speaker' && i === S.held)); b.disabled = S.mode === 'random'; b.style.opacity = S.mode === 'random' ? .4 : 1; });
}
function go(n) {
  n = clamp(n, 0, 3); if (n === step) return;
  step = n; stepT0 = performance.now(); sel = null; syncUI(); layout(); arrange(false);
}
function recompute() { SP = computeSplit(); syncUI(); layout(); histData(); arrange(false); }
SPEAKERS.forEach((s, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.style.setProperty('--c', `var(${SPK_VAR[i % 3]})`);
  b.innerHTML = `<i></i>${s}`; b.addEventListener('click', () => { S.mode = 'speaker'; S.held = i; recompute(); }); chipsEl.appendChild(b);
});
modeBtn.addEventListener('click', () => { S.mode = S.mode === 'speaker' ? 'random' : 'speaker'; recompute(); });
stratBtn.addEventListener('click', () => { S.strat = !S.strat; recompute(); });
replayBtn.addEventListener('click', () => { stepT0 = performance.now(); });
prevBtn.addEventListener('click', () => go(step - 1)); nextBtn.addEventListener('click', () => go(step + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); });
cv.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.type = e.pointerType; pointer.inside = true; });
cv.addEventListener('pointerleave', () => { pointer.inside = false; });
cv.addEventListener('pointerdown', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.type = e.pointerType;
  if (e.pointerType !== 'mouse') { const t = pick(); sel = t && t !== sel ? t : null; }
});
let cloudReady = false;
function relayout() { layout(); if (!cloudReady) { initCloud(); cloudReady = true; TILES.forEach(t => { t.x = t.fx = t.cx; t.y = t.fy = t.cy; }); } else initCloud(); histData(); arrange(true); }
addEventListener('resize', () => { relayout(); });
SP = computeSplit(); syncUI(); relayout();
requestAnimationFrame(frame);

window.__exs6 = {
  step: () => step, state: () => ({ mode: S.mode, held: S.held, strat: S.strat }), layout: () => L,
  split: () => ({ n: SP.n, cc: SP.cc, missingVal: SP.missingVal, missingTest: SP.missingTest }),
  stats: () => { const ts = trainStats(); const z = k => statsOf(CLIPS.filter(c => SP.zone[c.id] === k).map(c => (c.feat - ts.mean) / ts.std)); return { ts, train: z('train'), val: z('val'), test: z('test') }; },
  tiles: () => TILES.map(t => ({ id: t.c.id, x: t.x, y: t.y, a: t.a, z: t.tz })),

})();
