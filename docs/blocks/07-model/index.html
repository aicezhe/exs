<script src="../_shared/theme.js"></script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   The network, mirroring build_model in the notebook (cell 7).
   Every shape, parameter count and MAC count below is computed from
   this array: nothing is typed in by hand.
------------------------------------------------------------------ */
const CLASSES = ['telegram', 'elly', 'slack', 'focus', 'noise', 'unknown'];
const NEXT_BLOCK_READY = false;   // set to true when ../08-training/ exists
const DEFAULTS = { f1: 8, f2: 16 };
const layersFor = (f1, f2) => [
  { type: 'input', shape: [99, 13, 1] },
  { type: 'conv', filters: f1, k: 3, pad: 'same' },
  { type: 'maxpool', size: 2 },
  { type: 'conv', filters: f2, k: 3, pad: 'same' },
  { type: 'maxpool', size: 2 },
  { type: 'dropout', rate: 0.25 },
  { type: 'gap' },
  { type: 'dense', units: CLASSES.length, act: 'softmax' },
];
const NAMES = { input: 'Input', conv: 'Conv2D', maxpool: 'MaxPool2D', dropout: 'Dropout', gap: 'GlobalAvgPool', dense: 'Dense' };

// output shape, parameters, multiply-accumulates of every layer
function summarize(layers) {
  let shape = null;
  const rows = layers.map(l => {
    let params = 0, macs = 0, out;
    if (l.type === 'input') out = l.shape.slice();
    else if (l.type === 'conv') {
      const [h, w, c] = shape; out = [h, w, l.filters];   // "same" padding keeps h and w
      params = (l.k * l.k * c + 1) * l.filters; macs = h * w * l.k * l.k * c * l.filters;
    } else if (l.type === 'maxpool') out = [Math.floor(shape[0] / l.size), Math.floor(shape[1] / l.size), shape[2]];   // rounds down
    else if (l.type === 'dropout') out = shape.slice();
    else if (l.type === 'gap') out = [shape[2]];
    else { const n = shape[0]; out = [l.units]; params = (n + 1) * l.units; macs = n * l.units; }
    shape = out;
    return { name: NAMES[l.type], type: l.type, shape: out, params, macs, int8: params };   // int8: 1 byte per parameter
  });
  return { rows, params: rows.reduce((a, r) => a + r.params, 0), macs: rows.reduce((a, r) => a + r.macs, 0) };
}

// the layers each step talks about
const STEP_ROWS = [[0], [1], [2], [3, 4], [5], [6], [7]];
const CAPTIONS = [
  'Input: 99 frames × 13 coefficients, 1 channel.',
  null,   // built from the numbers: conv 1
  'Keeps the strongest response, halves the size. The last row and column are dropped.',
  null,   // conv 2
  'Training only: the model must not rely on single units. It is removed on the board.',
  'Average of each map: 16 numbers describe the whole clip. No parameters.',
  'softmax turns scores into probabilities. The board sends the largest one as label and confidence.',
];

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const ease = u => 1 - Math.pow(1 - u, 3);
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const sh = s => s.join(' × ');

/* ------------------------------------------------------------------
   Illustrative numbers: a synthetic MFCC-like matrix, random filters,
   and the real arithmetic of conv, pool, GAP and softmax on them.
------------------------------------------------------------------ */
function makeRng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rngOf = seed => { const r = makeRng(seed); return () => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(6.283185 * r()); };
const grid = (h, w, fn) => Array.from({ length: h }, (_, i) => Array.from({ length: w }, (_, j) => fn(i, j)));   // [h][w]

// maps are indexed [t][k]: t = frame (0..98), k = coefficient (0..12)
function makeInput() {
  const g = rngOf(7);
  const raw = grid(99, 13, (t, k) => Math.sin(t * .13 + k * .55) * 1.1 + Math.sin(t * .045 - k * .2) * .9 + (k < 3 ? 1.2 : 0) - (t > 40 && t < 62 ? k * .12 : 0) + g() * .35);
  const flat = raw.flat(), m = flat.reduce((a, b) => a + b, 0) / flat.length, sd = Math.sqrt(flat.reduce((a, b) => a + (b - m) ** 2, 0) / flat.length);
  return raw.map(r => r.map(v => (v - m) / sd));   // standardized, like the notebook does
}
function conv(maps, W, b) {   // maps [c][h][w] -> [f][h][w], 3x3, "same" padding, ReLU
  const c = maps.length, h = maps[0].length, w = maps[0][0].length;
  return W.map((wf, f) => grid(h, w, (i, j) => {
    let s = b[f];
    for (let ch = 0; ch < c; ch++) for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
      const y = i + di, x = j + dj; if (y >= 0 && y < h && x >= 0 && x < w) s += maps[ch][y][x] * wf[ch][di + 1][dj + 1];
    }
    return Math.max(0, s);
  }));
}
const pool = maps => maps.map(m => grid(Math.floor(m.length / 2), Math.floor(m[0].length / 2), (i, j) => Math.max(m[2 * i][2 * j], m[2 * i][2 * j + 1], m[2 * i + 1][2 * j], m[2 * i + 1][2 * j + 1])));
const softmax = z => { const mx = Math.max(...z), e = z.map(v => Math.exp(v - mx)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); };

const INPUT = makeInput();
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ST = { f1: DEFAULTS.f1, f2: DEFAULTS.f2, train: true, batch: 0 };
let M = null;   // the model data for the current f1, f2

function weights(seed, f, c, scale) { const g = rngOf(seed); return Array.from({ length: f }, () => Array.from({ length: c }, () => grid(3, 3, () => g() * scale))); }
function build() {
  const sum = summarize(layersFor(ST.f1, ST.f2));
  const W1 = weights(11, ST.f1, 1, .55), b1 = Array.from({ length: ST.f1 }, (_, i) => (i % 3 - 1) * .08);
  const c1 = conv([INPUT], W1, b1), p1 = pool(c1);
  const W2 = weights(23, ST.f2, ST.f1, .28), b2 = Array.from({ length: ST.f2 }, () => 0);
  const c2 = conv(p1, W2, b2), p2 = pool(c2);
  const gapv = p2.map(m => { const f = m.flat(); return f.reduce((a, b) => a + b, 0) / f.length; });
  const gd = rngOf(31), Wd = Array.from({ length: CLASSES.length }, () => gapv.map(() => gd() * .12)), bd = CLASSES.map(() => 0);
  const scores = Wd.map((w, k) => w.reduce((a, v, i) => a + v * gapv[i], bd[k])), probs = softmax(scores);
  const bm = (m, ramp) => bitmap(m, ramp);
  M = { sum, W1, b1, c1, p1, W2, c2, p2, gapv, Wd, bd, scores, probs,
    bmIn: bitmap(INPUT, 'raw', true), bmC1: c1.map(m => bm(m, 'map')), bmP1: p1.map(m => bm(m, 'map')), bmC2: c2.map(m => bm(m, 'map')), bmP2: p2.map(m => bm(m, 'map')) };
}
const rgbOf = n => THEME.rgb[n].split(',').map(Number);
// a 1-pixel-per-cell canvas for a map; time runs left to right, coefficients top to bottom
function bitmap(m, ramp, signed) {
  const h = m.length, w = m[0].length, c = document.createElement('canvas'); c.width = h; c.height = w;
  const x = c.getContext('2d'), im = x.createImageData(h, w), flat = m.flat(), lo = signed ? Math.min(...flat) : 0, hi = Math.max(...flat, 1e-6);
  const A = rgbOf('bgGlow'), B = rgbOf(ramp === 'raw' ? 'gray' : 'link'), C = rgbOf(ramp === 'raw' ? 'ink' : 'neon');
  for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) {
    const t = clamp((m[i][j] - lo) / (hi - lo || 1), 0, 1), k = (j * h + i) * 4, a = t < .5 ? A : B, b = t < .5 ? B : C, u = t < .5 ? t * 2 : (t - .5) * 2;
    im.data[k] = mix(a[0], b[0], u); im.data[k + 1] = mix(a[1], b[1], u); im.data[k + 2] = mix(a[2], b[2], u); im.data[k + 3] = 255;
  }
  x.putImageData(im, 0, 0); return c;
}

/* ------------------------------------------------------------------
   Setup
------------------------------------------------------------------ */
const cv = $('c'), ctx = cv.getContext('2d');
const hudEl = $('hud'), capEl = $('cap'), toolsEl = $('tools'), wiEl = $('whatif');
const prevBtn = $('prev'), nextBtn = $('next'), onwardEl = $('onward');
const trainBtn = $('mode'), inferBtn = $('infer'), batchBtn = $('batch');
const dots = [...document.querySelectorAll('#dots i')];
const MONO = THEME.mono;
const NSTEPS = 7;
let W = 0, H = 0, DPR = 0, narrow = false, fs = 14, step = 0, stepT0 = 0, now = 0;
const L = {};
const A = new Array(NSTEPS).fill(0); A[0] = 1;
const UI = { wi: 49, wj: 6, manual: 0, ci: 24, cj: 3, cls: -1 };   // window position, last drag time, chosen pooled cell and class

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function T(t, x, y, col, size, align = 'left', a = 1, weight = 400) {
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${MONO}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y); ctx.globalAlpha = 1;
}
function fitSize(t, maxW, size) { ctx.font = `${size}px ${MONO}`; const w = ctx.measureText(t).width; return w > maxW ? Math.max(8.5, size * maxW / w) : size; }
function bmp(c, x, y, w, h, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.imageSmoothingEnabled = false; ctx.drawImage(c, x, y, w, h); ctx.restore(); }
function frameRect(x, y, w, h, col, lw = 1.2, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); ctx.restore(); }
const code = (t, x, cy, maxW, a = 1) => {
  const sz = fitSize(t, maxW - 14, fs - 1.5); ctx.font = `${sz}px ${MONO}`; const w = Math.min(maxW, ctx.measureText(t).width + 14);
  ctx.globalAlpha = a; rr(x, cy - 10, w, 20, 6); ctx.fillStyle = THEME.codeBg; ctx.fill(); ctx.globalAlpha = 1; T(t, x + 7, cy, THEME.codeInk, sz, 'left', a);
};
const note = (x, y, align, a = 1, txt = 'illustrative values') => { if (narrow) { x = L.D.x + L.D.w; y = L.D.y + L.D.h - 4; align = 'right'; } T(txt, x, y, THEME.muted, Math.max(10, fs * .78), align, a); };
const f1s = v => (v >= 0 ? ' ' : '') + v.toFixed(1);

/* ------------------------------------------------------------------
   Layout: network strip, detail area, summary table, steppers
------------------------------------------------------------------ */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (innerWidth === W && innerHeight === H && dpr === DPR) return;
  W = innerWidth; H = innerHeight; DPR = dpr;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function layout() {
  resize();
  narrow = W < 800; fs = narrow ? 12 : 14;
  const hudB = hudEl.getBoundingClientRect().bottom, capTop = capEl.getBoundingClientRect().top;
  toolsEl.style.bottom = (H - capTop + 8) + 'px';
  const pad = narrow ? 16 : 32, y0 = hudB + 10, y1 = capTop - 8 - (step === 4 ? 38 + 8 : 0);
  Object.assign(L, { pad, y0, y1, capTop });
  const rowH = narrow ? 14.5 : 23, tH = rowH * 9 + (narrow ? 32 : 72);
  if (narrow) {
    const cw = W - 2 * pad; wiEl.style.left = pad + 'px'; wiEl.style.width = cw + 'px';
    const wh = wiEl.offsetHeight; wiEl.style.top = (y1 - wh) + 'px';
    const tt = y1 - wh - 6 - tH;
    L.table = { x: pad, y: tt, w: cw, h: tH, rowH };
    L.S = { x: pad, y: y0, w: cw, h: tt - 8 - y0 };
    L.strip = { x: pad, y: y0, w: 92, h: L.S.h, vertical: true };
    L.D = { x: pad + 100, y: y0, w: cw - 100, h: L.S.h };
  } else {
    const tw = 372, tx = W - pad - tw; wiEl.style.left = tx + 'px'; wiEl.style.width = tw + 'px';
    L.table = { x: tx, y: y0, w: tw, h: tH, rowH };
    wiEl.style.top = (y0 + tH + 18) + 'px';
    L.S = { x: pad, y: y0, w: tx - 28 - pad, h: y1 - y0 };
    L.strip = { x: pad, y: y0, w: L.S.w, h: 56, vertical: false };
    L.D = { x: pad, y: y0 + 74, w: L.S.w, h: L.S.h - 74 };
  }
}

/* ------------------------------------------------------------------

    w.forEach((v, i) => { ctx.save(); ctx.globalAlpha = a * (.25 + .6 * Math.abs(v) / mw); ctx.strokeStyle = v >= 0 ? THEME.link : THEME.gray; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0 + i * (cw + 2) + cw / 2, y0 + ph + 2); ctx.lineTo(rx - 6, ry + cls * rh + rh / 2); ctx.stroke(); ctx.restore(); });
  }
  CLASSES.forEach((c, k) => {
    const y = ry + k * rh, win = k === best, sel = k === cls;
    if (sel) { ctx.fillStyle = THEME.a('neon', .1); ctx.fillRect(rx - 4, y, rw + 4, rh - 2); }
    T(c, rx, y + rh / 2, win ? THEME.neon : THEME.ink, fitSize(c, lbl - 6, fs), 'left', a, win ? 700 : 400);
    ctx.globalAlpha = a; ctx.fillStyle = win ? THEME.neon : THEME.a('link', .8); ctx.fillRect(barx, y + rh * .22, Math.max(2, P[k] * barw), rh * .5); ctx.globalAlpha = 1;
    T((P[k] * 100).toFixed(1) + '%', rx + rw, y + rh / 2, win ? THEME.neon : THEME.ink, fitSize('00.0%', 50, fs - 1), 'right', a, win ? 700 : 400);
  });
  const ty = ry + 6 * rh + 14;
  T(`${CLASSES[cls]}: ${n} weights + bias, score ${M.scores[cls].toFixed(2)}`, rx, ty, THEME.ink, fitSize(`${CLASSES[cls]}: 00 weights + bias, score -0.00`, rw, fs - 1), 'left', a);
  if (narrow) {   // the weights of the class as small signed bars
    const w = M.Wd[cls], mw = Math.max(...w.map(Math.abs)), wy = ty + 20, cw2 = (rw - (n - 1) * 2) / n;
    w.forEach((v, i) => { const h = Math.abs(v) / mw * 12; ctx.globalAlpha = a; ctx.fillStyle = v >= 0 ? THEME.link : THEME.gray; ctx.fillRect(rx + i * (cw2 + 2), v >= 0 ? wy - h : wy, cw2, h); ctx.globalAlpha = 1; });
  }
  if (!narrow) T('the board sends the largest one as label + confidence', rx, ty + 22, THEME.muted, fitSize('the board sends the largest one as label + confidence', rw, fs - 2), 'left', a);
  note(D.x + D.w, D.y + 7, 'right', a);
}

/* ------------------------------------------------------------------
   Loop, input, controls
------------------------------------------------------------------ */
let last = 0;
function frame(ts) {
  const t = ts / 1000, dt = Math.min(.05, last ? t - last : .016); last = t; now = performance.now();
  const k = reduce ? 1 : Math.min(1, dt * 7);
  for (let i = 0; i < NSTEPS; i++) A[i] += ((i === step ? 1 : 0) - A[i]) * k;
  ctx.clearRect(0, 0, W, H);
  drawStrip(1); drawTable();
  if (A[0] > .01) drawInput(A[0]);
  if (A[1] > .01) drawConv1(A[1]);
  if (A[2] > .01) drawPool1(A[2]);
  if (A[3] > .01) drawConv2(A[3]);
  if (A[4] > .01) drawDrop(A[4]);
  if (A[5] > .01) drawGap(A[5]);
  if (A[6] > .01) drawDense(A[6]);
  requestAnimationFrame(frame);
}
const inRect = (r, x, y) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
let drag = false;
function pointerAt(e, down) {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (down) for (let i = 0; i < 8; i++) { if (inRect(nodeBox(i), x, y)) { go(stepOfNode(i)); return; } }
  if (step === 1 && inRect(L.m1, x, y) && (down || drag)) {
    drag = true; UI.wi = clamp(Math.floor((x - L.m1.x) / L.m1.w * 99), 0, 98); UI.wj = clamp(Math.floor((y - L.m1.y) / L.m1.h * 13), 0, 12); UI.manual = performance.now();
  } else if (step === 2 && inRect(L.pm, x, y) && (down || drag)) {
    drag = true; UI.ci = clamp(Math.floor((x - L.pm.x) / L.pm.w * 49), 0, 48); UI.cj = clamp(Math.floor((y - L.pm.y) / L.pm.h * 6), 0, 5); UI.manual = performance.now();
  } else if (step === 6 && down && inRect(L.cls, x, y)) UI.cls = clamp(Math.floor((y - L.cls.y) / L.cls.h), 0, CLASSES.length - 1);
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture && cv.setPointerCapture(e.pointerId); pointerAt(e, true); });
cv.addEventListener('pointermove', e => { if (drag) pointerAt(e, false); });
const endDrag = () => { drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

function capFor(i) {
  const r = M.sum.rows;
  if (i === 1) return `The same 9 weights + bias are reused everywhere: ${r[1].params} parameters in total.`;
  if (i === 3) return `${ST.f2} filters look for combinations of the first ${ST.f1} patterns: ${r[3].params} parameters.`;
  if (i === 5) return CAPTIONS[5].replace('16', String(ST.f2));
  return CAPTIONS[i];
}
function syncUI() {
  dots.forEach((d, i) => d.classList.toggle('on', i === step));
  prevBtn.disabled = step === 0; nextBtn.hidden = step === NSTEPS - 1; onwardEl.hidden = step !== NSTEPS - 1;
  capEl.textContent = capFor(step);
  toolsEl.classList.toggle('on', step === 4);
  trainBtn.setAttribute('aria-pressed', String(ST.train)); inferBtn.setAttribute('aria-pressed', String(!ST.train)); batchBtn.hidden = !ST.train;
  const c = layersFor(ST.f1, ST.f2);
  [['t1', ST.f1, 4, 16, 2], ['t2', ST.f2, 8, 32, 4]].forEach(([id, v, lo, hi]) => { const el = $(id); el.querySelector('b').textContent = v; const b = el.querySelectorAll('button'); b[0].disabled = v <= lo; b[1].disabled = v >= hi; });
}
function go(n) { n = clamp(n, 0, NSTEPS - 1); if (n === step) return; step = n; stepT0 = performance.now(); UI.manual = 0; syncUI(); layout(); }
function setF(which, d) {
  if (which === 1) ST.f1 = clamp(ST.f1 + 2 * d, 4, 16); else ST.f2 = clamp(ST.f2 + 4 * d, 8, 32);
  build(); UI.cls = -1; syncUI(); layout();
}
[['t1', 1], ['t2', 2]].forEach(([id, w]) => { const b = $(id).querySelectorAll('button'); b[0].addEventListener('click', () => setF(w, -1)); b[1].addEventListener('click', () => setF(w, 1)); });
trainBtn.addEventListener('click', () => { ST.train = true; syncUI(); layout(); });
inferBtn.addEventListener('click', () => { ST.train = false; syncUI(); layout(); });
batchBtn.addEventListener('click', () => { ST.batch++; });
prevBtn.addEventListener('click', () => go(step - 1)); nextBtn.addEventListener('click', () => go(step + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); });
addEventListener('resize', layout);
if (NEXT_BLOCK_READY) { onwardEl.href = '../08-training/'; onwardEl.removeAttribute('aria-disabled'); }

build(); syncUI(); layout();
document.fonts && document.fonts.ready.then(layout);
requestAnimationFrame(frame);

window.__exs7 = {
  step: () => step, state: () => ({ f1: ST.f1, f2: ST.f2, train: ST.train }),
  summary: () => ({ params: M.sum.rows.filter(r => r.params).map(r => r.params), total: M.sum.params, macs: M.sum.macs, bytes: M.sum.rows.reduce((a, r) => a + r.int8, 0), shapes: M.sum.rows.map(r => r.shape) }),
  layout: () => L, win: () => ({ i: UI.wi, j: UI.wj }), probs: () => M.probs,
};
})();
