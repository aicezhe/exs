<link rel="stylesheet" href="../_shared/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--body); }
  body { background: var(--page-bg); }
  /* touch-action: none, so a finger drag on the graph moves the window instead of scrolling the page */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: fixed; pointer-events: none; z-index: 2; }
  .hud.tl { top: 28px; left: 32px; }
  .hud.bl { bottom: 26px; left: 32px; display: flex; gap: 22px; font-size: 13px; color: var(--muted); }
  /* "← all blocks": the back button of docs/blocks/index.html, in the HUD (which ignores the pointer, so the link turns it on) */
  .back { display: inline-block; margin: 0 0 14px; padding: 8px 14px; border: 1px solid var(--neon);
    border-radius: 999px; color: var(--ink); font-size: 14px; text-decoration: none; pointer-events: auto;
    transition: box-shadow .2s, background .2s, color .2s; }
  .back:hover, .back:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  .back:active { background: var(--neon); color: var(--on-neon); }
  .kicker { font: 700 12px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--neon); }
  h1 { margin: 8px 0 6px; font: 700 clamp(24px, 3.2vw, 40px)/1.15 var(--head); letter-spacing: -.01em; }
  .sub { font-size: 14px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }

  /* step caption and the step controls, bottom centre */
  #cap { position: fixed; z-index: 2; left: 50%; bottom: 86px; transform: translateX(-50%); width: min(660px, calc(100vw - 32px));
    text-align: center; font-size: 14.5px; line-height: 1.45; color: var(--ink); pointer-events: none; min-height: 21px; }
  #nav { position: fixed; z-index: 4; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; }
  #nav button, #tools button { font: inherit; color: var(--ink); background: color-mix(in srgb, var(--bg-glow) 72%, transparent); border: 1px solid var(--neon);
    cursor: pointer; display: grid; place-items: center; padding: 0; backdrop-filter: blur(4px);
    transition: border-color .2s, box-shadow .2s, opacity .2s; -webkit-tap-highlight-color: transparent; }
  #nav button:hover:not(:disabled), #nav button:focus-visible, #tools button:hover, #tools button:focus-visible, #onward:hover, #onward:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  #nav button:active:not(:disabled), #tools button:active, #onward:active { background: var(--neon); color: var(--on-neon); }
  #prev { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; }
  #next { width: 76px; height: 54px; border-radius: 27px; font-size: 26px; box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 25%, transparent); }
  #nav button[hidden] { display: none; }
  #nav button:disabled { opacity: .3; cursor: default; box-shadow: none; }
  #onward { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 22px; white-space: nowrap; font-size: 14px; color: var(--ink);
    text-decoration: none; background: color-mix(in srgb, var(--bg-glow) 72%, transparent); border: 1px solid var(--neon); box-shadow: 0 0 18px color-mix(in srgb, var(--neon) 25%, transparent); }
  #onward[hidden] { display: none; }
  #dots { display: flex; gap: 8px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); transition: background .2s, box-shadow .2s, border-color .2s; }
  #dots i.on { background: var(--neon); border-color: var(--neon); box-shadow: 0 0 8px var(--neon); }

  /* the buttons of step 2 (Auto, Add a loud click), just above the caption */
  #tools { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); display: none; gap: 10px; white-space: nowrap; }
  #tools.on { display: flex; }
  #tools button { height: 38px; padding: 0 18px; border-radius: 19px; font-size: 14px; }
  #auto { box-shadow: 0 0 16px color-mix(in srgb, var(--neon) 22%, transparent); }

  #card {
    position: fixed; z-index: 3; width: min(360px, 88vw); padding: 18px 20px 16px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    box-shadow: 0 10px 40px color-mix(in srgb, var(--bg) 50%, transparent), var(--panel-glow);
    backdrop-filter: blur(6px); pointer-events: none;
    opacity: 0; transform: translateY(6px); transition: opacity .18s ease, transform .18s ease;
  }
  #card.on { opacity: 1; transform: none; }
  #card.setting { border-color: color-mix(in srgb, var(--gray) 70%, transparent); }
  #card.quiet { border-color: color-mix(in srgb, var(--gray) 55%, transparent); box-shadow: 0 10px 40px color-mix(in srgb, var(--bg) 50%, transparent); }
  #card .tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    background: var(--neon); color: var(--on-neon); }
  #card.setting .tag, #card.quiet .tag { background: var(--gray); }
  #card h2 { margin: 8px 0 10px; font: 700 24px/1.15 var(--mono); color: var(--neon); word-break: break-word; }
  #card.setting h2 { color: var(--gray); }
  #card.quiet h2 { color: var(--ink); }
  #card code { display: block; padding: 7px 10px; border-radius: 8px; background: var(--code-bg);
    color: var(--code-ink); font: 400 13px/1.4 var(--mono); margin-bottom: 12px; word-break: break-word; }
  #card p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  @media (max-width: 700px) {
    #card { left: 16px !important; right: 16px; top: auto !important; bottom: 100px; width: auto; }
    .hud.tl { left: 16px; top: 18px; }
    .hud.bl { display: none; }
    #cap { font-size: 13px; bottom: 80px; }
  }
  @media (prefers-reduced-motion: reduce) { #card, #nav button, #tools button { transition: none; } }
</style>

<body>
<canvas id="c" aria-label="Clips: every recording is forced to exactly 1 second"></canvas>

<div class="hud tl" id="hud">
  <a class="back" href="../#how">← all blocks</a> <a class="back" href="../03-sound/">← Previous: Sound</a>
  <div class="kicker">Block 4 of 12</div>
  <h1>Clips</h1>
  <div class="sub">notebook cell 2 · tap or drag</div>
</div>
<div class="hud bl">
  <span><i class="dot" style="background:var(--gray)"></i>raw signal</span>
  <span><i class="dot" style="background:var(--neon);box-shadow:0 0 8px var(--neon)"></i>1 s window</span>

</div>

  <button id="click" type="button">Add a loud click</button>
</div>
<nav id="nav" aria-label="Steps">
  <button id="prev" type="button" aria-label="Previous step">←</button>
  <div id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button id="next" type="button" aria-label="Next step">→</button>
  <a id="onward" href="../05-mfcc/" hidden>Next block: MFCC →</a>
</nav>
<div id="card" role="status" aria-live="polite"></div>

<script src="../_shared/theme.js"></script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   CONSTANTS. N_CLIPS is a placeholder: put the number from the
   notebook here. The signals are synthetic (illustrative only) and
   are drawn at DRAW_RATE samples per second, not at SAMPLE_RATE.
------------------------------------------------------------------ */
const SAMPLE_RATE = 16000;
const CLIP_SECONDS = 1.0;
const N_SAMPLES = SAMPLE_RATE * CLIP_SECONDS;
const N_CLIPS = 24;
const DRAW_RATE = 800;                       // drawn samples per second
const N_WIN = Math.round(DRAW_RATE * CLIP_SECONDS); // window length in drawn samples

const CAPTIONS = [
  'librosa.load gives 16 kHz, mono. Now every clip must be exactly 1 s.',
  'Prefix sums give the energy of every window in one pass.',
  'np.pad adds zeros at the end, so the word sits at the start of short clips.',
  'Audio array: (N, 16000)',
];
const CODE = ['cs = cumsum(y**2)', 'energy = cs[N:] - cs[:-N]', 'start = argmax(energy)'];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;

// roles: raw sound = gray, processing = link green, the selected window and the answers = neon
const COL = { sig: THEME.neon, raw: THEME.gray, frame: THEME.link, zero: THEME.link, muted: THEME.muted, ink: THEME.ink, gray: THEME.muted };

/* ------------------------------------------------------------------
   Synthetic signals: a smooth burst (a few sines under a bell-shaped
   envelope, with a slow syllable ripple) plus weak noise. Fixed seeds.
------------------------------------------------------------------ */
function makeRng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const SIGMA = 0.16;      // width of the word burst, seconds
const WORD_AMP = 0.4;
function makeClip(seconds, center, seed, amp = WORD_AMP, noise = 0.03) {
  const rng = makeRng(seed), n = Math.round(seconds * DRAW_RATE), y = new Float32Array(n);
  const ph = [rng() * 6.28, rng() * 6.28, rng() * 6.28];
  for (let i = 0; i < n; i++) {
    const t = i / DRAW_RATE, u = (t - center) / SIGMA, env = Math.exp(-0.5 * u * u);
    const body = .6 * Math.sin(6.283 * 9 * t + ph[0]) + .3 * Math.sin(6.283 * 17 * t + ph[1]) + .2 * Math.sin(6.283 * 26 * t + ph[2]);
    const ripple = .6 + .4 * Math.sin(6.283 * 3.2 * (t - center) + 1);
    y[i] = amp * env * ripple * body / .6 * 0.7 + (rng() - .5) * 2 * noise;
  }
  return y;
}

// the four recordings of step 1 (same time scale), the long one is used in step 2, the short one in step 3
const RECS = [
  { sec: 0.6, c: 0.26, seed: 11 }, { sec: 1.0, c: 0.50, seed: 23 },
  { sec: 1.8, c: 0.95, seed: 37 }, { sec: 2.5, c: 1.70, seed: 45 },
].map(r => ({ ...r, y: makeClip(r.sec, r.c, r.seed) }));
const LONG = RECS[3], SHORT = RECS[0];

// the loud click that can be added to the long recording
const CLICK = { t: 0.45, amp: 1.0, tau: 0.045, f: 70 };
const CLICK_ARR = new Float32Array(LONG.y.length);
for (let i = 0; i < CLICK_ARR.length; i++) {
  const d = i / DRAW_RATE - CLICK.t;
  CLICK_ARR[i] = d < 0 ? 0 : CLICK.amp * Math.exp(-d / CLICK.tau) * Math.sin(6.283 * CLICK.f * d);
}

// energy of every window of the long recording: the same three lines as the code on the page
const E = { sig: new Float32Array(LONG.y.length), cs: new Float64Array(LONG.y.length + 1), e: new Float64Array(LONG.y.length - N_WIN + 1), arg: 0, max: 1 };
function rebuild(clickAmt) {
  const { sig, cs, e } = E;
  for (let i = 0; i < sig.length; i++) { sig[i] = LONG.y[i] + clickAmt * CLICK_ARR[i]; cs[i + 1] = cs[i] + sig[i] * sig[i]; }
  let best = 0;
  for (let i = 0; i < e.length; i++) { e[i] = cs[i + N_WIN] - cs[i]; if (e[i] > e[best]) best = i; }
  E.arg = best; E.max = e[best];
}
rebuild(0);
const energyAt = s => { const f = clamp(s * DRAW_RATE, 0, E.e.length - 1), i = Math.floor(f), j = Math.min(E.e.length - 1, i + 1); return mix(E.e[i], E.e[j], f - i); };

// quick-check signals (1 s each)
const CHECKS = [
  { k: 'good', label: 'good', ok: true, y: makeClip(1, .5, 71, .9, .02) },
  { k: 'clipped', label: 'clipped', ok: false, y: makeClip(1, .5, 72, .9, .02).map(v => clamp(v * 3.2, -1, 1)) },
  { k: 'flat', label: 'flat', ok: false, y: new Float32Array(DRAW_RATE) },
  { k: 'quiet', label: 'too quiet', ok: false, y: makeClip(1, .5, 73, .035, .004) },
];
const CHECK_TEXT = {
  good:    'The word sits in the middle of the clip. The shape is clear and nothing is cut off.',
  clipped: 'The peaks are flat at ±1: the signal was cut off, so the shape of the word is lost.',
  flat:    'No signal at all: an empty or broken file.',
  quiet:   'The amplitude is tiny: the word is hard to tell from the noise.',
};
const rngRows = makeRng(5);
const ROW_C = Array.from({ length: N_CLIPS }, () => .3 + .4 * rngRows());   // where the bright patch of each row sits

/* ------------------------------------------------------------------
   Setup
------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const card = $('card'), hudEl = $('hud'), capEl = $('cap'), toolsEl = $('tools');
const prevBtn = $('prev'), nextBtn = $('next'), autoBtn = $('auto'), clickBtn = $('click');
const dots = [...document.querySelectorAll('#dots i')];
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = THEME.mono;
const ease = u => 1 - Math.pow(1 - u, 3);
const easeIO = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

let W = 0, H = 0, DPR = 0, narrow = false, fs = 14.5, step = 0, stepT0 = 0, now = 0;
const L = {};
const A = { s: [1, 0, 0, 0], click: 0, emax: E.max * 1.08 };   // step fades, click fade, energy axis
const S1 = { ws: 0.15, drag: false, dx: 0, auto: null, line: -1, locked: false, clickOn: false, moved: 0, downX: 0, downY: 0 };

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function T(t, x, y, col, size, align = 'left', a = 1) {
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = `${size}px ${MONO}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y); ctx.globalAlpha = 1;
}
const prog = (dur, delay = 0) => reduce ? 1 : ease(clamp((now - stepT0 - delay) / dur, 0, 1));

// a waveform as one vertical min/max bar per pixel column; samples [i0, i1) of arr, t = 0 at x0
function wavePath(arr, x0, pps, yc, half, i0 = 0, i1 = arr.length) {
  const spp = DRAW_RATE / pps, xa = x0 + i0 / DRAW_RATE * pps, xb = x0 + i1 / DRAW_RATE * pps;
  ctx.beginPath();
  for (let px = Math.floor(xa); px <= Math.ceil(xb); px++) {
    const s0 = Math.max(i0, Math.floor((px - x0) * spp)), s1 = Math.min(i1, arr.length, Math.ceil((px + 1 - x0) * spp) + 1);
    if (s1 <= s0) continue;
    let mn = 1e9, mx = -1e9;
    for (let s = s0; s < s1; s++) { const v = arr[s]; if (v < mn) mn = v; if (v > mx) mx = v; }
    const ya = yc - mx * half, yb = yc - mn * half;
    ctx.moveTo(px + .5, ya); ctx.lineTo(px + .5, Math.max(yb, ya + 1));
  }
}
function strokeWave(arr, x0, pps, yc, half, col, lw, i0, i1, glow) {
  wavePath(arr, x0, pps, yc, half, i0, i1);
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  if (glow) { ctx.shadowColor = col; ctx.shadowBlur = glow; }
  ctx.stroke(); ctx.shadowBlur = 0;
}

/* ------------------------------------------------------------------
   Layout (recomputed on resize and on every step: the caption height changes)
------------------------------------------------------------------ */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (innerWidth === W && innerHeight === H && dpr === DPR) return;
  W = innerWidth; H = innerHeight; DPR = dpr;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function layout() {
  resize();
  narrow = W < 700; fs = narrow ? 12.5 : 14.5;
  const hudB = hudEl.getBoundingClientRect().bottom, capTop = capEl.getBoundingClientRect().top;
  toolsEl.style.bottom = (H - capTop + 8) + 'px';
  L.capTop = capTop; L.toolsTop = capTop - 8 - 38;
  const pad = narrow ? 16 : 32, cw = Math.min(W - 2 * pad, 1100), x0 = (W - cw) / 2, top = hudB + 10;
  Object.assign(L, { pad, cw, x0, top });
  L.g = [geo0(x0, cw, top, capTop - 10), geo1(x0, cw, top, L.toolsTop - 8), geo2(x0, cw, top, capTop - 10), geo3(x0, cw, top, capTop - 10)];
}

// step 1: four recordings, one time scale, one fixed 1 s frame
function geo0(x0, cw, y0, y1) {
  const pps = cw / 2.5, hh = y1 - y0 - 26, rowH = hh / 4;
  const rows = RECS.map((r, i) => { const t = y0 + 26 + i * rowH; return { top: t, h: rowH, yc: t + 16 + (rowH - 16) / 2, half: (rowH - 16) * .48, rec: r }; });
  return { x0, pps, y0, y1, rows, frame: { x: x0, y: y0 + 2, w: pps * CLIP_SECONDS, h: y1 - y0 - 2 } };
}
// step 2: the long recording, the energy curve, the code
function geo1(x0, cw, y0, y1) {
  const ln = narrow ? 20 : 24, fixed = 18 + 16 + 18 + 6 + 16 + 10 + (3 * ln + 4) + 10;
  const avail = Math.max(120, y1 - y0 - fixed), wh = Math.min(190, avail * .52), eh = Math.min(150, avail - wh);
  let y = y0; const g = { x0, pps: cw / 2.5, ln, cw };
  g.titleY = y + 9; y += 18; g.wy0 = y; g.wy1 = y + wh; g.wyc = y + wh / 2; g.half = wh / 2 * .86; y += wh;
  g.tickY = y + 9; y += 16; g.noteY = y + 9; y += 18 + 6; g.etitleY = y + 8; y += 16;
  g.ey0 = y; g.ey1 = y + eh; y += eh + 10; g.codeY0 = y; g.y1 = y1;
  return g;
}
// step 3: the short recording and its padding
function geo2(x0, cw, y0, y1) {
  const pps = cw / 1.1, h = y1 - y0, wh = clamp(h * .5, 100, 220), off = Math.max(0, (h - (wh + 80)) * .4), yc = y0 + 34 + off + wh / 2;
  return { x0, pps, yc, half: wh / 2 * .9, fy0: y0 + 6 + off, fy1: y0 + 34 + wh + 40 + off, y0 };
}
// step 4: the matrix and the quick check
function geo3(x0, cw, y0, y1) {
  const wide = cw >= 760, h = y1 - y0, g = { wide };
  if (wide) {
    const mw = Math.round(cw * .46), idx = 30;
    g.mx = x0 + idx; g.mw = mw - idx; g.my = y0 + 34; g.mh = Math.min(h - 50, N_CLIPS * 20); g.gap = 2;
    const qx = x0 + mw + 50, qw = x0 + cw - qx, cwid = (qw - 14) / 2, chei = Math.min(140, (g.mh - 14) / 2);
    g.qTitle = { x: qx, y: g.my - 14 };
    g.cells = CHECKS.map((c, i) => ({ c, x: qx + (i % 2) * (cwid + 14), y: g.my + Math.floor(i / 2) * (chei + 14), w: cwid, h: chei }));
  } else {
    const idx = 24;
    g.mx = x0 + idx; g.mw = cw - idx; g.my = y0 + 30; g.mh = Math.min((h - 30) * .46, N_CLIPS * 9); g.gap = 1;
    const qy = g.my + g.mh + 40, cwid = (cw - 3 * 8) / 4, chei = clamp(y1 - qy, 56, 92);
    g.qTitle = { x: x0, y: qy - 14 };
    g.cells = CHECKS.map((c, i) => ({ c, x: x0 + i * (cwid + 8), y: qy, w: cwid, h: chei }));
  }
  g.rowH = (g.mh - (N_CLIPS - 1) * g.gap) / N_CLIPS;
  return g;
}

/* ------------------------------------------------------------------
   Steps
------------------------------------------------------------------ */
let act = null, shownKey = '';
function setStep(n) {
  if (n === step || n < 0 || n > 3) return;
  step = n; act = null; shownKey = ''; card.classList.remove('on'); stepT0 = performance.now();
  S1.drag = false;
  if (reduce) A.s = A.s.map((_, i) => i === n ? 1 : 0);
  syncUI(); layout();
}
function syncUI() {
  capEl.textContent = CAPTIONS[step];
  dots.forEach((d, i) => d.classList.toggle('on', i === step));
  prevBtn.disabled = step === 0; nextBtn.disabled = step === 3;
  $('onward').hidden = step !== 3; nextBtn.hidden = step === 3; // the last step: the way on replaces →
  toolsEl.classList.toggle('on', step === 1);
}
prevBtn.addEventListener('click', () => setStep(step - 1));
nextBtn.addEventListener('click', () => setStep(step + 1));
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') setStep(step + 1);
  else if (e.key === 'ArrowLeft') setStep(step - 1);
  else if (e.key === 'Escape') act = null;
});

function runAuto() {
  act = null;
  if (reduce) { S1.ws = E.arg / DRAW_RATE; S1.line = 2; S1.locked = true; S1.auto = null; return; }
  S1.auto = { t0: performance.now(), from: S1.ws }; S1.line = 0; S1.locked = false;
}
autoBtn.addEventListener('click', runAuto);
clickBtn.addEventListener('click', () => {
  act = null; S1.clickOn = !S1.clickOn; S1.locked = false; if (!S1.auto) S1.line = -1;
  clickBtn.textContent = S1.clickOn ? 'Remove the click' : 'Add a loud click';
  if (reduce) { A.click = S1.clickOn ? 1 : 0; rebuild(A.click); A.emax = E.max * 1.08; }
});

/* ------------------------------------------------------------------
   Pointer: hover on a mouse, tap on a touch screen; in step 2 a drag
   moves the 1 s window (mouse and finger, pointer events).
------------------------------------------------------------------ */
const pointer = { x: -1e4, y: -1e4, inside: false, type: 'mouse' };
const setPtr = e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true; pointer.type = e.pointerType === 'mouse' ? 'mouse' : 'touch'; };

function dragZone(px, py) {   // where a press starts a drag in step 2: 1 = wave, 2 = energy curve
  const g = L.g[1];

      S1.ws = mix(S1.auto.from, E.arg / DRAW_RATE, easeIO(f));
      if (f >= 1) { S1.ws = E.arg / DRAW_RATE; S1.auto = null; S1.locked = true; }
    }
  }

  if (pointer.type === 'mouse') act = pointer.inside && !S1.drag ? pick() : null;
  ctx.clearRect(0, 0, W, H);
  if (A.s[0] > .01) drawS0(A.s[0]);
  if (A.s[1] > .01) drawS1(A.s[1]);
  if (A.s[2] > .01) drawS2(A.s[2]);
  if (A.s[3] > .01) drawS3(A.s[3]);
  cv.style.cursor = step === 1 ? (S1.drag ? 'grabbing' : dragZone(pointer.x, pointer.y) && pointer.inside ? 'grab' : 'default') : act ? 'pointer' : 'default';

  showCard();
  if (act) placeCard();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => { layout(); });
syncUI(); layout();
requestAnimationFrame(frame);

// debug hook used by the test script
window.__exs3 = {
  step: () => step, layout: () => L, state: () => ({ ws: S1.ws, locked: S1.locked, line: S1.line, auto: !!S1.auto, clickOn: S1.clickOn }),
  argmax: () => E.arg / DRAW_RATE, energy: () => ({ max: E.max, arg: E.arg }), card: () => card.classList.contains('on') ? card.textContent : '',
  pick: (x, y) => { pointer.x = x; pointer.y = y; const r = pick(); return r && r.key; },
};
})();
