<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg0: #030720;
    --link: #3b7bff;
    --pink: #ff4fa3;
    --setting: #9db8ff;
    --ink: #e8eeff;
    --muted: #8fa0d6;
    --panel: rgba(8, 16, 64, .72);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --disp: Monoton, Orbitron, system-ui, sans-serif;
    --label: Orbitron, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg0); color: var(--ink);
    font-family: var(--label); }
  body { background: radial-gradient(ellipse at 50% 35%, #0d1b6b 0%, #07103f 45%, #030720 100%) fixed; }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  a { color: inherit; text-decoration: none; }

  main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 36px 20px 64px; min-height: 100vh; }

  /* Home: the wordmark sits top left, the three questions in a row below it */
  main { max-width: none; display: flex; flex-direction: column; padding: 20px 24px 28px; }
  body.home main { max-width: 1280px; padding: 36px 20px 24px; }
  /* panels: "← back" and "exs" sit in the corners of the screen, the content below is kept to a readable width and set lower */
  .view:not(#home) > :not(.topbar) { width: 100%; max-width: 1600px; margin-left: auto; margin-right: auto; }
  .view:not(#home) h2 { margin-top: clamp(28px, 7vh, 80px); }
  .hero { margin: 0; }
  .wordmark { margin: 0; font: 400 clamp(48px, 7vw, 84px)/1 var(--disp); letter-spacing: 0; color: var(--ink); }
  .wordmark .l { display: inline-block; }
  /* the pink dot is drawn, not typed */
  .wordmark .dot { width: .14em; height: .14em; margin-left: .1em; border-radius: 50%; background: var(--pink); box-shadow: 0 0 .25em rgba(255, 79, 163, .7); }
  .lede { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
  .etym, .said { margin: 0; font-size: clamp(12px, 1.2vw, 15px); line-height: 1.5; }
  .etym { color: var(--muted); }
  .etym i { font-style: italic; }
  .said { color: var(--ink); }
  /* once per visit, the first time the home view shows (JS adds .intro): letters rise one after another, then the lines fade in */
  .intro .wordmark .l { animation: letter .55s ease both; animation-delay: calc(var(--i) * 80ms); }
  .intro .fade { animation: fadein .6s ease .45s both; }
  @keyframes letter { from { opacity: 0; transform: translateY(.22em); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .view { display: none; }
  .view.on { display: flex; flex-direction: column; flex: 1; min-height: 0; animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Home: What. Why. How. side by side; white at rest, pink with a glow and larger on hover, caption fades in below */
  .rows { flex: 1; display: flex; align-items: center; justify-content: center; gap: clamp(20px, 4vw, 72px); flex-wrap: wrap; padding: 32px 0; }
  .row { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 8px 4px; outline: none; }
  .row .big { font: 700 clamp(36px, 6.4vw, 92px)/1.1 var(--label); color: var(--ink);
    transition: transform .3s ease, color .3s ease, text-shadow .3s ease; }
  .row .cap { color: var(--muted); font: 400 clamp(12px, 1.3vw, 16px)/1.4 var(--label); text-align: center; opacity: 0;
    transform: translateY(-6px); transition: opacity .3s ease, transform .3s ease; }
  .row:hover .big, .row:focus-visible .big { transform: scale(1.18); color: var(--pink);
    text-shadow: 0 0 14px rgba(255, 79, 163, .85), 0 0 40px rgba(255, 79, 163, .5); }
  .row:hover .cap, .row:focus-visible .cap { opacity: 1; transform: none; }
  @media (hover: none) { .row .cap { opacity: .8; transform: none; } } /* touch: no hover, so the captions stay visible */

  /* Panels */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .mini { font: 600 14px/1 var(--mono); color: var(--muted); letter-spacing: -.02em; }
  .back { display: inline-block; margin: 0; padding: 8px 14px; border: 1px solid rgba(143, 160, 214, .35);
    border-radius: 999px; color: var(--muted); font-size: 14px; transition: border-color .2s, color .2s; }
  .back:hover, .back:focus-visible { color: var(--ink); border-color: var(--pink); outline: none; }
  h2 { margin: 14px 0 6px; font-size: clamp(40px, 8vw, 84px); line-height: 1.05; font-weight: 600; letter-spacing: -.02em; }
  .lead { margin: 0 0 26px; color: var(--muted); font-size: 16px; max-width: 60ch; }
  .empty { padding: 26px; border: 1px dashed rgba(143, 160, 214, .4); border-radius: 14px; color: var(--muted); max-width: 520px; }

  /* Block cards */
  .grid { display: grid; grid-template-columns: 1fr; grid-auto-rows: minmax(104px, 1fr); gap: clamp(12px, 1.6vw, 24px); flex: 1; margin-top: clamp(12px, 3vh, 36px); }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 800px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { position: relative; display: flex; flex-direction: column; gap: 6px; padding: clamp(16px, 1.8vw, 24px);
    border-radius: 14px; background: var(--panel); border: 1px solid rgba(59, 123, 255, .35);
    backdrop-filter: blur(4px); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .card .n { font: 600 clamp(28px, 3vw, 40px)/1 var(--mono); color: var(--pink); }
  .card .t { font-size: clamp(18px, 1.7vw, 24px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 76px; margin-top: auto; }
  .card .s { font-size: clamp(13.5px, 1.1vw, 16px); color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .chip { position: absolute; top: 14px; right: 14px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(157, 184, 255, .5); color: var(--setting); }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px); border-color: var(--pink);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .4), 0 0 24px rgba(255, 79, 163, .2); outline: none; }
  .card.soon { opacity: .5; border-style: dashed; }
  .card.soon .chip { border-color: rgba(143, 160, 214, .3); color: var(--muted); }
  .card.soon .n { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .view.on, .intro .wordmark .l, .intro .fade { animation: none; } .card, .row .big, .row .cap { transition: none; } }
</style>
</head>
<body class="home">
<canvas id="bg"></canvas>
<main>
  <div id="home" class="view" data-view="">
    <section class="hero">
      <h1 class="wordmark" id="wm" aria-label="exs"><span class="l" style="--i:0" aria-hidden="true">e</span><span class="l" style="--i:1" aria-hidden="true">x</span><span class="l" style="--i:2" aria-hidden="true">s</span><span class="l dot" style="--i:3" aria-hidden="true"></span></h1>
      <div class="lede fade">
        <p class="etym">from Latin <i>exsecutio</i> — a carrying out, a performing</p>
        <p class="said">Say a word. The laptop does it.</p>
      </div>
    </section>
    <nav class="rows" aria-label="Sections">
      <a class="row" href="#what"><span class="big">What.</span><span class="cap">what it does</span></a>
      <a class="row" href="#why"><span class="big">Why.</span><span class="cap">why this project</span></a>
      <a class="row" href="#how"><span class="big">How.</span><span class="cap">how it works</span></a>
    </nav>
  </div>

  <section class="view" data-view="what">
    <div class="topbar"><a class="back" href="#">← back</a><span class="mini">exs</span></div>
    <h2>What.</h2>
    <div class="empty">Coming soon.</div>
  </section>

  <section class="view" data-view="why">
    <div class="topbar"><a class="back" href="#">← back</a><span class="mini">exs</span></div>
    <h2>Why.</h2>
    <div class="empty">Coming soon.</div>
  </section>

  <section class="view" data-view="how">
    <div class="topbar"><a class="back" href="#">← back</a><span class="mini">exs</span></div>
    <h2>How.</h2>
    <p class="lead">From sound to action, block by block.</p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   Blocks. A card opens only when href is set and ready is true;
   otherwise it is shown as "soon". Paths are relative to this file
   (docs/blocks/index.html).
------------------------------------------------------------------ */
const BLOCKS = [
  { t: 'Imports',      s: 'Libraries and settings',          href: './01-imports/', ready: true },
  { t: 'Dataset',      s: 'From files to a table',           href: './02-data/',    ready: true },
  { t: 'Sound',        s: 'From a wave to numbers',          href: './03-sound/',   ready: true,  chip: 'animation' },
  { t: 'Clips',        s: 'Make every clip 1 second',        href: './04-clips/',   ready: true },
  { t: 'MFCC',         s: 'The 99 × 13 matrix',              href: './05-mfcc/',    ready: true,  chip: 'animation' },
  { t: 'Split',        s: 'Train, validation, test',         href: null,            ready: false },
  { t: 'Model',        s: 'A small CNN',                     href: null,            ready: false },
  { t: 'Training',     s: 'Learning from examples',          href: null,            ready: false },
  { t: 'Evaluation',   s: 'Accuracy and errors',             href: null,            ready: false },
  { t: 'Quantization', s: 'Shrink to int8',                  href: null,            ready: false },
  { t: 'Deployment',   s: 'Board to laptop',                 href: null,            ready: false },
  { t: 'Experiments',  s: 'What moves the accuracy',         href: null,            ready: false },
];

const grid = document.getElementById('grid');
BLOCKS.forEach((b, i) => {
  const open = !!b.href && b.ready === true;
  const el = document.createElement(open ? 'a' : 'div');
  el.className = 'card' + (open ? '' : ' soon');
  if (open) el.href = b.href; else el.setAttribute('aria-disabled', 'true');
  const n = String(i + 1).padStart(2, '0');
  el.innerHTML = `<span class="n">${n}</span><span class="t"></span><span class="s"></span><span class="chip"></span>`;
  el.querySelector('.t').textContent = b.t;
  el.querySelector('.s').textContent = b.s;
  el.querySelector('.chip').textContent = open ? (b.chip || 'open') : 'soon';
  grid.appendChild(el);
});

/* ---- view routing by URL hash: #what, #why, #how (back button works) ---- */
const views = [...document.querySelectorAll('.view')];
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let introDone = false;
function route() {
  const h = location.hash.replace('#', '');
  const name = ['what', 'why', 'how'].includes(h) ? h : '';
  views.forEach(v => v.classList.toggle('on', v.dataset.view === name));
  document.body.classList.toggle('home', name === '');
  if (name === '' && !introDone) { // the entrance plays once, never again when coming back to home
    introDone = true;
    if (!reduceMotion) { document.body.classList.add('intro'); setTimeout(() => document.body.classList.remove('intro'), 1600); }
  }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route); route();

/* ---- quiet background: drifting dots with faint links ---- */
const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dots = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = W < 700 ? 28 : 60;
  dots = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25 }));
}
addEventListener('resize', resize); resize();
function tick() {
  ctx.clearRect(0, 0, W, H);
  for (const d of dots) { if (!reduce) { d.x += d.vx; d.y += d.vy; } if (d.x < 0 || d.x > W) d.vx *= -1; if (d.y < 0 || d.y > H) d.vy *= -1; }
  for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
    const a = dots[i], b = dots[j], dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (dist < 150) { ctx.strokeStyle = `rgba(59,123,255,${0.22 * (1 - dist / 150)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(130,175,255,.55)';
  for (const d of dots) { ctx.beginPath(); ctx.arc(d.x, d.y, 1.6, 0, 6.283); ctx.fill(); }
  requestAnimationFrame(tick);
}
tick();
})();
</script>
</body>
</html>
