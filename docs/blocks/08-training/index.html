  #cap { position: fixed; z-index: 2; left: 50%; bottom: 84px; transform: translateX(-50%); width: min(680px, calc(100vw - 32px));

  #nav button:hover:not(:disabled), #nav button:focus-visible, #onward:hover, #onward:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  #nav button:active:not(:disabled), #onward:active { background: var(--neon); color: var(--on-neon); }
  #prev { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; }

  /* card (parameters, "sparse") and tooltip */
  #card { position: fixed; z-index: 6; left: 50%; top: 50%; width: min(380px, 88vw); padding: 18px 20px 16px; transform: translate(-50%, -46%);
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; box-shadow: 0 10px 40px color-mix(in srgb, var(--bg) 50%, transparent), var(--panel-glow);

  #card h2 { margin: 8px 0 10px; font: 700 17px/1.25 var(--mono); color: var(--neon); word-break: break-word; }

<!-- Optional real training history. If data/history.js exists next to this page, it is drawn instead of the illustrative curves.
     Format (one value per epoch, Keras `history.history`; accuracy arrays are optional):
       window.EXS_HISTORY = { loss: [..], val_loss: [..], accuracy: [..], val_accuracy: [..] };
     Without the file the page shows illustrative data and marks it "illustrative". -->

<script src="../_shared/theme.js"></script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   Constants. Values from the notebook: EPOCHS, LEARNING_RATE, BATCH_SIZE (cell 1), compile / EarlyStopping / fit (cell 8).
------------------------------------------------------------------ */
const EPOCHS = 100, LEARNING_RATE = 0.005, BATCH_SIZE = 32, PATIENCE = 15;
const CLASSES = ['telegram', 'elly', 'slack', 'focus', 'noise', 'unknown'];
const TRUE_CLASS = 1;                                         // "elly"
const UNTRAINED = [0.14, 0.22, 0.18, 0.11, 0.20, 0.15];       // illustrative, sums to 1
const BETA1 = 0.9, BETA2 = 0.999, EPS = 1e-7;                 // Keras Adam defaults
const N_DEMO_CLIPS = 96;                                      // illustrative: 3 batches of BATCH_SIZE
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const html = (tag, cls, parent, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = k => THEME.rgb[k].split(',').map(Number);

const PARAMS = {
  optimizer: { k: 'optimizer', v: 'Adam', h: 'optimizer = Adam', p: ['Adam adapts the step for every weight separately, from the history of its own gradients.', 'Why: we do not have to tune a step size per layer.'] },
  lr:        { k: 'learning_rate', v: String(LEARNING_RATE), h: 'learning_rate = LEARNING_RATE', p: ['How far a weight moves in one update. 0.005 is our starting value.', 'It still has to be checked on validation: too small is slow, too large jumps over the minimum.'] },
  loss:      { k: 'loss', v: 'sparse_categorical_crossentropy', h: 'loss = sparse_categorical_crossentropy', p: ['How wrong the probabilities are: −log of the probability given to the right class.', '"Sparse" because the labels are integers 0–5, not one-hot vectors.'] },
  patience:  { k: 'patience', v: String(PATIENCE), h: 'patience = 15', p: ['EarlyStopping waits 15 epochs without any improvement of val_loss, then stops.', 'Why: a few bad epochs can be noise, fifteen in a row mean the model started to overfit.'] },
  restore:   { k: 'restore_best_weights', v: 'True', h: 'restore_best_weights = True', p: ['After stopping, the model goes back to the weights of the best epoch, not the last one.', 'Why: the last 15 epochs were worse on validation.'] },
  batch:     { k: 'batch_size', v: String(BATCH_SIZE), h: 'batch_size = BATCH_SIZE', p: ['Number of clips used for one weight update.', 'Why 32: a common small value, it gives many updates per epoch with a steady direction.'] },
  epochs:    { k: 'epochs', v: String(EPOCHS), h: 'epochs = EPOCHS', p: ['The upper limit of passes over the training set.', 'EarlyStopping usually stops training much earlier.'] },
};
const SCENES = [
  { title: 'What the model sees', params: ['optimizer', 'loss'], cap: 'Untrained: the model guesses almost evenly.' },
  { title: 'How wrong is it?', params: ['loss'], cap: 'The closer the right class gets to 1, the smaller the loss. Training pushes the loss down.' },
  { title: 'One step', params: ['optimizer', 'lr'], cap: "Adam scales each weight's step by its own gradient history." },
  { title: 'Batches and epochs', params: ['batch', 'epochs'], cap: 'One update per batch. One epoch = every clip seen once.' },
  { title: 'Validation and EarlyStopping', params: ['patience', 'restore', 'epochs'], cap: 'Stop when validation stops improving, then keep the best weights.' },
];

/* ------------------------------------------------------------------
   Card, tooltip, parameter pills, tween
------------------------------------------------------------------ */
const card = $('card'), tip = $('tip');
let cardKey = null;
function closeCard() { cardKey = null; card.classList.remove('on'); document.querySelectorAll('.ppill.on').forEach(b => b.classList.remove('on')); }
function openCard(key, tag, head, paras) {
  if (cardKey === key) { closeCard(); return; }
  cardKey = key; card.innerHTML = '';
  html('span', 'tag', card, tag); html('h2', '', card, head);
  paras.forEach(t => html('p', '', card, t)); html('div', 'x', card, 'tap to close');
  card.classList.add('on');
  document.querySelectorAll('.ppill').forEach(b => b.classList.toggle('on', b.dataset.key === key));
}
card.addEventListener('click', closeCard);
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
let tipTimer = 0;
function showTip(text, x, y, ms) {
  tip.textContent = text; tip.classList.add('on');
  const w = tip.offsetWidth; tip.style.left = clamp(x - w / 2, 8, innerWidth - w - 8) + 'px'; tip.style.top = Math.max(8, y - 40) + 'px';
  clearTimeout(tipTimer); if (ms) tipTimer = setTimeout(() => tip.classList.remove('on'), ms);
}
const hideTip = () => tip.classList.remove('on');

function renderParams(list) {
  const box = $('params'); box.innerHTML = '';
  html('span', 'src', box, 'from notebook cell 8');
  list.forEach(id => {
    const P = PARAMS[id], b = html('button', 'ppill', box); b.type = 'button'; b.dataset.key = id; b.title = 'from notebook cell 8';
    html('span', '', b, P.k + ' = '); html('b', '', b, P.v);
    b.addEventListener('click', e => { e.stopPropagation(); openCard(id, 'from notebook cell 8', P.h, P.p); });
  });
}

/* fn(t) for t in 0..1 with easing; with reduced motion it is called once at 1. Returns a cancel function. */
function tween(ms, fn, done) {
  if (reduce) { fn(1); if (done) done(); return () => {}; }
  let raf = 0, t0 = 0, stop = false;
  const step = now => { if (stop) return; if (!t0) t0 = now; const t = clamp((now - t0) / ms, 0, 1); fn(1 - Math.pow(1 - t, 3)); if (t < 1) raf = requestAnimationFrame(step); else if (done) done(); };
  raf = requestAnimationFrame(step);
  return () => { stop = true; cancelAnimationFrame(raf); };
}

/* ------------------------------------------------------------------
   Scene 1: forward pass
------------------------------------------------------------------ */
const S1 = { stop: null };
function buildScene1() {
  const host = $('s1'); host.innerHTML = ''; if (S1.stop) S1.stop();
  const narrow = innerWidth < 760;
  const W = narrow ? 390 : 1000, H = narrow ? 520 : 320;
  const svg = el('svg', { class: 'fig', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'A clip becomes a 99 by 13 matrix, goes through a CNN, and gives six probabilities' }, host);
  const defs = el('defs', {}, svg), mk = el('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
  el('path', { d: 'M0 1L9 5L0 9z', fill: THEME.link }, mk);
  const arrow = (x1, y1, x2, y2) => el('path', { d: `M${x1} ${y1}L${x2} ${y2}`, stroke: THEME.link, 'stroke-width': 1.4, fill: 'none', 'marker-end': 'url(#ah)' }, svg);

  // the clip: a deterministic waveform
  const wx = narrow ? 20 : 10, wy = narrow ? 56 : 120, ww = narrow ? 120 : 140, wh = 30;
  let d = '';
  for (let i = 0; i <= 80; i++) { const t = i / 80, env = Math.sin(Math.PI * t) ** 1.2, y = wy + Math.sin(t * 61) * Math.cos(t * 7) * wh * env; d += (i ? 'L' : 'M') + (wx + t * ww).toFixed(1) + ' ' + y.toFixed(1); }
  el('path', { d, fill: 'none', stroke: THEME.gray, 'stroke-width': 1.4 }, svg);
  el('text', { x: wx + ww / 2, y: wy + 52, 'text-anchor': 'middle', 'font-size': 11 }, svg, '1-second clip');

  // the 99 × 13 matrix, gray → green
  const mx = narrow ? 200 : 215, my = narrow ? 30 : 80, cw = narrow ? 1.5 : 1.5, ch = narrow ? 4 : 6;
  const gc = rgb('gray'), lc = rgb('neon');
  for (let r = 0; r < 13; r++) for (let c = 0; c < 99; c++) {
    const v = clamp(0.5 + 0.5 * Math.sin(c * 0.13 + r * 0.8) * Math.cos(r * 0.35 + c * 0.03), 0, 1);
    el('rect', { x: mx + c * cw, y: my + r * ch, width: cw + .2, height: ch + .2, fill: `rgb(${mix(gc, lc, v).map(Math.round)})`, opacity: .3 + .65 * v }, svg);
  }
  el('text', { x: mx + 99 * cw / 2, y: my + 13 * ch + 18, 'text-anchor': 'middle', 'font-size': 11 }, svg, '99 × 13 matrix');

  // the CNN: Conv, Conv, Dense
  if (narrow) {
    ['Conv', 'Conv', 'Dense'].forEach((t, i) => {
      const y = 150 + i * 40; el('rect', { x: 120, y, width: 150, height: 32, rx: 8, fill: THEME.a('link', .12), stroke: THEME.link, 'stroke-width': 1.3 }, svg);
      el('text', { x: 195, y: y + 20, 'text-anchor': 'middle', 'font-size': 12, style: 'fill:var(--ink)' }, svg, t);
    });
    arrow(60, 100, 60, 150); arrow(270, 130, 205, 145); arrow(195, 272, 195, 292);
  } else {
    ['Conv', 'Conv', 'Dense'].forEach((t, i) => {
      const x = 440 + i * 56, y = 80, tx = x + 25, ty = y + 55;
      el('rect', { x, y, width: 50, height: 110, rx: 8, fill: THEME.a('link', .12), stroke: THEME.link, 'stroke-width': 1.3 }, svg);
      el('text', { x: tx, y: ty, 'text-anchor': 'middle', 'font-size': 11, transform: `rotate(-90 ${tx} ${ty + 4})`, style: 'fill:var(--ink)' }, svg, t);
    });
    el('text', { x: 522, y: 212, 'text-anchor': 'middle', 'font-size': 11 }, svg, 'CNN');
    arrow(160, 120, 205, 120); arrow(372, 120, 435, 120); arrow(612, 120, 660, 120);
  }

  // probability bars

  const pTrain = el('path', { fill: 'none', stroke: THEME.link, 'stroke-width': 1.6, 'stroke-dasharray': '5 3' }, svg), pVal = el('path', { fill: 'none', stroke: THEME.neon, 'stroke-width': 2.8 }, svg);
  const bestDot = el('circle', { r: 6, fill: THEME.bg, stroke: THEME.neon, 'stroke-width': 2, opacity: 0 }, svg), bestTxt = el('text', { 'font-size': 11, 'text-anchor': 'middle', style: 'fill:var(--neon)', opacity: 0 }, svg, '');
  // the weights track: from which epoch the current weights come
  const ty = H - 30; el('line', { x1: L, x2: W - R, y1: ty, y2: ty, stroke: THEME.dim }, svg); el('text', { x: L - 6, y: ty + 4, 'text-anchor': 'end', 'font-size': 10 }, svg, 'weights');
  const marker = el('path', { d: 'M0 -7L5 0L0 7L-5 0z', fill: THEME.gray, transform: 'translate(-100 0)' }, svg), mtxt = el('text', { y: ty + 20, 'text-anchor': 'middle', 'font-size': 10.5, style: 'fill:var(--ink)' }, svg, '');
  const patBox = html('div', '', side); patBox.id = 'pat'; html('div', 'l', patBox, 'EarlyStopping'); const patV = html('div', 'v', patBox);
  const flash = html('div', '', side, 'STOP'); flash.id = 'stopflash';
  const info = html('div', 'sub', side); info.style.cssText = 'margin-top:8px;text-align:left;min-height:3em';
  const btn = html('button', 'btn', side); btn.type = 'button'; btn.style.cssText = 'margin-top:10px;width:100%';
  const pathOf = (arr, n) => arr.slice(0, n).map((v, i) => (i ? 'L' : 'M') + X(i + 1).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  let n = 0, timer = 0, state = 'idle', restoreStop = null;   // state: idle, run, pause, done
  const setWeights = e => { marker.setAttribute('transform', `translate(${X(e).toFixed(1)} ${ty})`); mtxt.setAttribute('x', X(e).toFixed(1)); mtxt.textContent = 'epoch ' + Math.round(e); };
  function draw() {
    pTrain.setAttribute('d', pathOf(Hd.loss, n)); pVal.setAttribute('d', pathOf(Hd.val, n));
    const be = n ? bests[n - 1] : 0;
    if (be) { const bx = X(be), by = Y(Hd.val[be - 1]); bestDot.setAttribute('cx', bx); bestDot.setAttribute('cy', by); bestDot.setAttribute('opacity', 1); bestTxt.setAttribute('x', bx); bestTxt.setAttribute('y', by + 22); bestTxt.setAttribute('opacity', 1); bestTxt.textContent = 'best epoch ' + be; }
    else { bestDot.setAttribute('opacity', 0); bestTxt.setAttribute('opacity', 0); }
    patV.textContent = `patience ${n ? pat[n - 1] : 0} / ${PATIENCE}`; if (n && state !== 'done') setWeights(n);
    if (state !== 'done') info.textContent = n ? `epoch ${n} · val_loss ${Hd.val[n - 1].toFixed(2)}` + (Hd.real && Hd.vacc ? ` · val_accuracy ${(Hd.vacc[n - 1] * 100).toFixed(0)}%` : '') : 'press Train, or tap the chart';
    btn.textContent = state === 'run' ? 'Pause' : state === 'pause' ? 'Resume' : state === 'done' ? 'Replay' : 'Train';
  }
  function reset() { clearTimeout(timer); if (restoreStop) restoreStop(); n = 0; state = 'idle'; patBox.classList.remove('stop'); flash.classList.remove('go'); marker.setAttribute('transform', 'translate(-100 0)'); mtxt.textContent = ''; draw(); }
  function finishRun() {
    // restore_best_weights=True: the marker jumps back to the best epoch
    state = 'done'; draw(); info.textContent = 'restore_best_weights=True';
    restoreStop = tween(700, t => { setWeights(stopE + (finalBest - stopE) * t); }, () => { mtxt.textContent = 'restored: epoch ' + finalBest; info.textContent = `weights restored from epoch ${finalBest}`; });
  }
  function tick() {
    if (state !== 'run') return;
    n++; draw();
    if (n >= stopE) { patBox.classList.add('stop'); flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); timer = setTimeout(finishRun, reduce ? 0 : 900); return; }
    timer = setTimeout(tick, reduce ? 0 : 110);
  }
  function toggle() {
    if (state === 'done') reset();
    if (state === 'idle') { state = 'run'; draw(); tick(); }
    else if (state === 'run') { state = 'pause'; clearTimeout(timer); draw(); }
    else if (state === 'pause') { state = 'run'; draw(); tick(); }
  }
  btn.addEventListener('click', e => { e.stopPropagation(); toggle(); }); svg.setAttribute('data-own-tap', ''); svg.addEventListener('click', toggle);
  S5.stop = () => { clearTimeout(timer); if (restoreStop) restoreStop(); };
  S5.api = { epochs: () => n, state: () => state, stopEpoch: stopE, best: finalBest, toggle };
  reset();
}

document.fonts && document.fonts.ready.then(fitTop);

window.__exs = { scene: () => scene, go: setScene, s4: () => S4.t, advance4: () => S4.advance && S4.advance(), s5: () => S5.api, adam: adamPath };
})();
