<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why</title>
<link rel="stylesheet" href="../_shared/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { background: var(--page-bg); }
  button { font: inherit; color: inherit; }

  .hud { position: fixed; pointer-events: none; z-index: 2; top: 28px; left: 32px; right: 32px; }
  .back { display: inline-block; margin: 0 0 12px; padding: 8px 14px; border: 1px solid var(--neon); border-radius: 999px; color: var(--ink); font-size: 14px; text-decoration: none; pointer-events: auto;
    transition: box-shadow .2s, background .2s, color .2s; }
  .back:hover, .back:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  .back:active { background: var(--neon); color: var(--on-neon); }
  .kicker { font: 700 14px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--neon); }
  h1 { margin: 6px 0 0; font: 700 clamp(30px, 4.4vw, 56px)/1.1 var(--head); letter-spacing: -.01em; }
  .sub { margin-top: 8px; font-size: clamp(16px, 1.6vw, 20px); color: var(--muted); }

  #stage { position: fixed; left: 0; right: 0; top: var(--top, 190px); bottom: var(--bot, 130px); touch-action: pan-y; }
  .scene { position: absolute; left: 50%; top: 0; bottom: 0; width: min(1100px, calc(100% - 64px)); transform: translateX(-50%); display: flex; flex-direction: column; justify-content: center; gap: 18px;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s .3s; }
  .scene.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .3s ease, visibility 0s; }

  #cap { position: fixed; z-index: 2; left: 50%; bottom: 84px; transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); text-align: center; font-size: 16px; line-height: 1.4; pointer-events: none; min-height: 22px; }
  #nav { position: fixed; z-index: 4; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; }
  #prev, #next, #onward { cursor: pointer; font: inherit; color: var(--ink); background: color-mix(in srgb, var(--bg-glow) 72%, transparent); border: 1px solid var(--neon); display: grid; place-items: center; padding: 0; }
  #prev { width: 44px; height: 44px; border-radius: 50%; } #next { width: 76px; height: 54px; border-radius: 27px; font-size: 26px; }
  #onward { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 22px; white-space: nowrap; font-size: 14px; text-decoration: none; }
  #prev:disabled { opacity: .3; } #next[hidden], #onward[hidden] { display: none; }
  #dots { display: flex; gap: 8px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); transition: background .2s, box-shadow .2s, border-color .2s; }
  #dots i.on { background: var(--neon); border-color: var(--neon); box-shadow: 0 0 8px var(--neon); }
  #prog { font: 14px var(--mono); color: var(--muted); min-width: 3.4em; }

  /* scene 1: sound -> numbers -> model -> chip */
  #chain { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .node { flex: 1; max-width: 220px; min-height: min(30vh, 220px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 16px; border: 1.3px solid var(--link);
    background: color-mix(in srgb, var(--bg-glow) 85%, transparent); cursor: pointer; transition: background .25s, border-color .25s, color .25s, box-shadow .25s, opacity .5s, transform .5s; -webkit-tap-highlight-color: transparent; opacity: 0; transform: translateY(14px); }
  .scene.on .node { opacity: 1; transform: none; transition-delay: 0s, 0s, 0s, 0s, calc(var(--i) * .15s), calc(var(--i) * .15s); }
  .node:hover, .node:focus-visible { box-shadow: 0 0 16px color-mix(in srgb, var(--neon) 40%, transparent); outline: none; }
  .node svg { width: 64px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--gray); }
  .node b { font: 700 clamp(20px, 2.4vw, 30px) var(--mono); }
  .node.sel { background: var(--neon); border-color: var(--neon); color: var(--on-neon); } .node.sel svg { color: var(--on-neon); }
  .arrow { font: 28px var(--mono); color: var(--link); flex: none; }
  #tip { min-height: 30px; text-align: center; font: 700 clamp(16px, 1.8vw, 21px)/1.4 var(--mono); color: var(--neon); transition: opacity .2s; }
  #tip.idle { color: var(--muted); font-weight: 400; }

  /* scene 2: the word, and a desktop that cleans itself */
  .s2 { flex-direction: row; align-items: center; justify-content: center; gap: 32px; }
  #say { flex: none; width: 230px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 16px; border-radius: 16px; border: 1.3px solid var(--neon); background: color-mix(in srgb, var(--neon) 7%, transparent); cursor: pointer; }
  #say b { font: 700 clamp(28px, 3.4vw, 44px) var(--mono); color: var(--neon); }
  #wave { display: flex; align-items: center; gap: 4px; height: 56px; }
  #wave i { width: 5px; height: 10px; border-radius: 3px; background: var(--link); transition: height .15s; }
  #say.talk #wave i { animation: bar .5s ease-in-out infinite alternate; animation-delay: calc(var(--k) * 45ms); }
  @keyframes bar { from { height: 8px; } to { height: 52px; background: var(--neon); } }
  #say small { font: 14px var(--mono); color: var(--muted); }
  #desk { position: relative; flex: 1; max-width: 700px; aspect-ratio: 16 / 10; max-height: 100%; border-radius: 14px; border: 1.3px solid var(--dim); background: color-mix(in srgb, var(--bg-glow) 60%, transparent); cursor: pointer; overflow: hidden; }
  .win { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--h); display: flex; flex-direction: column; border-radius: 10px; border: 1.2px solid var(--gray); background: var(--bg); overflow: hidden;
    transition: opacity .35s ease, transform .35s ease; transition-delay: var(--d, 0s); }
  .win .bar { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; background: color-mix(in srgb, var(--gray) 14%, transparent); border-bottom: 1px solid var(--dim); }
  .win .bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .win .name { flex: 1; display: grid; place-items: center; font: 700 clamp(14px, 1.6vw, 18px) var(--mono); color: var(--muted); }
  .win.keep { border-color: var(--link); } .win.keep .name { color: var(--ink); }
  .run .win:not(.keep) { opacity: 0; transform: scale(.88); }
  #dnd { position: absolute; right: 12px; top: 12px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--neon); background: var(--bg); font: 700 14px var(--mono); color: var(--neon);
    opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; }
  #dnd svg { width: 16px; height: 16px; fill: currentColor; }
  .run #dnd { opacity: 1; transform: none; transition-delay: 2.1s; }
  .instant, .instant * { transition: none !important; }

  @media (max-width: 699px) {
    .hud { left: 16px; right: 16px; top: 18px; }
    .scene { width: calc(100% - 32px); gap: 12px; }
    #cap { font-size: 14px; bottom: 76px; }
    h1 { font-size: 30px; }
    #chain { flex-direction: column; gap: 4px; }
    .node { flex: none; width: 100%; max-width: none; min-height: 0; flex-direction: row; justify-content: flex-start; gap: 16px; padding: 10px 16px; }
    .node svg { width: 52px; height: 36px; }
    .arrow { transform: rotate(90deg); font-size: 22px; line-height: 1; }
    .s2 { flex-direction: column; gap: 14px; }
    #say { width: 100%; flex-direction: row; justify-content: space-between; padding: 10px 16px; } #say small { display: none; } #wave { height: 40px; }
    #desk { flex: none; width: 100%; max-height: none; }
    .win .bar { height: 16px; padding: 0 5px; } .win .bar i { width: 6px; height: 6px; } .win .name { font-size: 14px; }
    #dnd { font-size: 14px; padding: 4px 8px; right: 6px; top: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="hud" id="hud">
  <a class="back" href="../index.html">← all blocks</a>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
</div>

<main id="stage" aria-label="Why: practice, and a tool I will use">
  <section class="scene" id="s1"><div id="chain"></div><div id="tip" class="idle">tap a step</div></section>
  <section class="scene s2" id="s2">
    <div id="say" data-own-tap><b>“focus”</b><div id="wave"></div><small>tap to say it again</small></div>
    <div id="desk" data-own-tap aria-label="A desktop: five windows close, VS Code and Safari stay"></div>
  </section>
</main>

<div id="cap" aria-live="polite"></div>
<nav id="nav" aria-label="Scenes">
  <button id="prev" type="button" aria-label="Previous scene">←</button>
  <div id="dots" aria-hidden="true"><i></i><i></i></div>
  <span id="prog" aria-hidden="true"></span>
  <button id="next" type="button" aria-label="Next scene">→</button>
  <a id="onward" href="../index.html" hidden>Main screen →</a>
</nav>

<script>
(() => {
'use strict';
const SCENES = [
  { kicker: 'Why · 01', title: 'Practice.',     sub: 'Machine learning on something I can hear and test myself.', cap: 'A small problem with every step visible.' },
  { kicker: 'Why · 02', title: 'I will use it.', sub: 'A study tool that stays on my desk.',                       cap: 'One word closes the distractions. I say it before I study.' },
];
const STEPS = [
  { name: 'sound',   tip: 'Record a word with a microphone.',           icon: '<path d="M2 22c4 0 4-14 8-14s4 28 8 28 4-24 8-24 4 20 8 20 4-10 8-10 4 6 8 6"/>' },
  { name: 'numbers', tip: 'Turn the sound into a small table of numbers.', icon: '<rect x="6" y="6" width="52" height="32" rx="4"/><path d="M6 17h52M6 28h52M23 6v32M41 6v32"/>' },
  { name: 'model',   tip: 'Train a small neural network on those numbers.', icon: '<circle cx="10" cy="12" r="4"/><circle cx="10" cy="32" r="4"/><circle cx="32" cy="8" r="4"/><circle cx="32" cy="22" r="4"/><circle cx="32" cy="36" r="4"/><circle cx="54" cy="22" r="4"/><path d="M14 12l14-4M14 12l14 10M14 32l14-10M14 32l14 4M36 8l14 14M36 22h14M36 36l14-14"/>' },
  { name: 'chip',    tip: 'Run it on a board the size of a thumb.',     icon: '<rect x="16" y="8" width="32" height="28" rx="4"/><path d="M24 8V2M32 8V2M40 8V2M24 36v6M32 36v6M40 36v6M16 17h-6M16 27h-6M48 17h6M48 27h6"/>' },
];
/* The desktop: five windows close in turn, VS Code and Safari stay. (If what/assets/focus gets real window images, replace the placeholders here.) */
const FOCUS_WINDOWS = [
  { name: 'Mail',    x: '3%',  y: '5%',  w: '34%', h: '38%', close: 1 },
  { name: 'Chrome',  x: '30%', y: '8%',  w: '38%', h: '42%', close: 2 },
  { name: 'Music',   x: '62%', y: '4%',  w: '30%', h: '34%', close: 3 },
  { name: 'Notes',   x: '4%',  y: '52%', w: '30%', h: '40%', close: 4 },
  { name: 'Slack',   x: '58%', y: '46%', w: '36%', h: '42%', close: 5 },
  { name: 'VS Code', x: '14%', y: '30%', w: '40%', h: '46%', keep: true },
  { name: 'Safari',  x: '44%', y: '36%', w: '40%', h: '44%', keep: true },
];
const NSCENES = SCENES.length, $ = id => document.getElementById(id);
const stage = $('stage'), hud = $('hud'), cap = $('cap'), prevBtn = $('prev'), nextBtn = $('next'), onward = $('onward');
const dots = [...document.querySelectorAll('#dots i')], scenes = [...document.querySelectorAll('.scene')];
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// scene 1
const tip = $('tip'), nodes = []; let sel = -1;
STEPS.forEach((s, i) => {
  if (i) { const a = document.createElement('span'); a.className = 'arrow'; a.textContent = '→'; a.setAttribute('aria-hidden', 'true'); $('chain').appendChild(a); }
  const b = document.createElement('button'); b.type = 'button'; b.className = 'node'; b.style.setProperty('--i', i);
  b.innerHTML = `<svg viewBox="0 0 64 44" aria-hidden="true">${s.icon}</svg><b>${s.name}</b>`;
  b.addEventListener('click', () => { sel = sel === i ? -1 : i; nodes.forEach((n, k) => n.classList.toggle('sel', k === sel)); tip.textContent = sel >= 0 ? STEPS[sel].tip : 'tap a step'; tip.classList.toggle('idle', sel < 0); });
  $('chain').appendChild(b); nodes.push(b);
});

// scene 2
const desk = $('desk'), say = $('say'), wave = $('wave'); let runTimer = 0;
for (let k = 0; k < 14; k++) { const i = document.createElement('i'); i.style.setProperty('--k', k); wave.appendChild(i); }
FOCUS_WINDOWS.forEach(w => {
  const d = document.createElement('div'); d.className = 'win' + (w.keep ? ' keep' : '');
  d.style.cssText = `--x:${w.x};--y:${w.y};--w:${w.w};--h:${w.h};--d:${w.keep ? 0 : (0.5 + w.close * 0.3).toFixed(2)}s`;
  d.innerHTML = `<div class="bar"><i></i><i></i><i></i></div><div class="name">${w.name}</div>`; desk.appendChild(d);
});
const dnd = document.createElement('div'); dnd.id = 'dnd'; dnd.innerHTML = '<svg viewBox="0 0 16 16"><path d="M13 10.5A6 6 0 0 1 5.5 3a6 6 0 1 0 7.5 7.5z"/></svg>Do Not Disturb'; desk.appendChild(dnd);
function playDesk() {
  clearTimeout(runTimer); desk.classList.add('instant'); desk.classList.remove('run'); say.classList.remove('talk'); void desk.offsetWidth; desk.classList.remove('instant');
  if (reduce) { desk.classList.add('run'); return; }
  say.classList.add('talk'); runTimer = setTimeout(() => { desk.classList.add('run'); }, 700); setTimeout(() => say.classList.remove('talk'), 1500);
}
desk.addEventListener('click', playDesk); say.addEventListener('click', playDesk);

let scene = 0;
const fit = () => { stage.style.setProperty('--top', (hud.getBoundingClientRect().bottom + 8) + 'px'); stage.style.setProperty('--bot', (innerHeight - cap.getBoundingClientRect().top + 8) + 'px'); };
function setScene(n) {
  n = clamp(n, 1, NSCENES); const was = scene; scene = n;
  scenes.forEach((s, i) => s.classList.toggle('on', i === n - 1));
  dots.forEach((d, i) => d.classList.toggle('on', i === n - 1));
  $('prog').textContent = `${n} / ${NSCENES}`;
  prevBtn.disabled = n === 1; nextBtn.hidden = n === NSCENES; onward.hidden = n !== NSCENES;
  const S = SCENES[n - 1]; $('kicker').textContent = S.kicker; $('title').textContent = S.title; $('sub').textContent = S.sub; cap.textContent = S.cap;
  if (n === 2 && was !== 2) playDesk();
  fit();
}
prevBtn.addEventListener('click', () => setScene(scene - 1)); nextBtn.addEventListener('click', () => setScene(scene + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') setScene(scene + 1); else if (e.key === 'ArrowLeft') setScene(scene - 1); });
addEventListener('resize', fit);
// one-finger swipe changes the scene; the click that follows a swipe is ignored
let down = null, swiped = false;
stage.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, type: e.pointerType }; swiped = false; });
stage.addEventListener('pointercancel', () => { down = null; });
stage.addEventListener('pointerup', e => {
  if (!down) return; const d = down; down = null; const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (d.type !== 'mouse' && Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swiped = true; setScene(scene + (dx < 0 ? 1 : -1)); }
});
stage.addEventListener('click', e => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);
setScene(1); document.fonts && document.fonts.ready.then(fit);
window.__why = { scene: () => scene, go: setScene };
})();
</script>
<script src="../_shared/tapstep.js"></script>
</body>
</html>
