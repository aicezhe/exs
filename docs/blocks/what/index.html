<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What</title>
<link rel="stylesheet" href="../_shared/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { background: var(--page-bg); }
  /* touch-action: none: a finger on the graph never scrolls the page */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: fixed; pointer-events: none; z-index: 2; }
  .hud.tl { top: 28px; left: 32px; }
  /* "← all blocks" and "← Previous": links in the HUD (which ignores the pointer, so the links turn it on) */
  .back { display: inline-block; margin: 0 0 14px; padding: 8px 14px; border: 1px solid var(--neon);
    border-radius: 999px; color: var(--ink); font-size: 14px; text-decoration: none; pointer-events: auto;
    transition: box-shadow .2s, background .2s, color .2s; }
  .back:hover, .back:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  .back:active { background: var(--neon); color: var(--on-neon); }
  .kicker { font: 700 12px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--neon); }
  h1 { margin: 8px 0 6px; font: 700 clamp(24px, 3.2vw, 40px)/1.15 var(--head); letter-spacing: -.01em; }
  .sub { font-size: 14px; color: var(--muted); }

  /* step caption and the step controls, bottom centre */
  #cap { position: fixed; z-index: 2; left: 50%; bottom: 86px; transform: translateX(-50%); width: min(660px, calc(100vw - 32px));
    text-align: center; font-size: 14.5px; line-height: 1.45; color: var(--ink); pointer-events: none; min-height: 21px; }
  #nav { position: fixed; z-index: 4; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; }
  #nav button, #tools button, #chips button, .tool button { font: inherit; color: var(--ink); background: color-mix(in srgb, var(--bg-glow) 72%, transparent); border: 1px solid var(--neon);
    cursor: pointer; display: grid; place-items: center; padding: 0; backdrop-filter: blur(4px);
    transition: border-color .2s, box-shadow .2s, opacity .2s, background .2s, color .2s; -webkit-tap-highlight-color: transparent; }
  #nav button:hover:not(:disabled), #nav button:focus-visible, #tools button:hover, #tools button:focus-visible, #chips button:hover, #chips button:focus-visible,
  .tool button:hover, .tool button:focus-visible, #onward:hover, #onward:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  #nav button:active:not(:disabled), #tools button:active, .tool button:active, #onward:active { background: var(--neon); color: var(--on-neon); }
  #prev { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; }
  #next { width: 76px; height: 54px; border-radius: 27px; font-size: 26px; box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 25%, transparent); }
  #nav button[hidden] { display: none; }
  #nav button:disabled { opacity: .3; cursor: default; box-shadow: none; }
  #onward { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 22px; white-space: nowrap; font-size: 14px; color: var(--ink);
    text-decoration: none; background: color-mix(in srgb, var(--bg-glow) 72%, transparent); border: 1px solid var(--neon); box-shadow: 0 0 18px color-mix(in srgb, var(--neon) 25%, transparent); }
  #onward[hidden] { display: none; }
  /* the next block does not exist yet: the link is shown but does nothing */
  #onward[aria-disabled="true"] { opacity: .4; box-shadow: none; pointer-events: none; cursor: default; }
  #dots { display: flex; gap: 8px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); transition: background .2s, box-shadow .2s, border-color .2s; }
  #dots i.on { background: var(--neon); border-color: var(--neon); box-shadow: 0 0 8px var(--neon); }

  /* the switches of the steps, just above the caption */
  #tools { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); display: none; gap: 10px; white-space: nowrap; }
  #tools.on { display: flex; }
  #tools button { height: 38px; padding: 0 18px; border-radius: 19px; font-size: 14px; }
  #tools button[hidden] { display: none; }
  #tools button[aria-pressed="true"] { background: var(--neon); color: var(--on-neon); }

  /* speaker chips: the border is the colour of the speaker, a neon fill marks the chosen one */
  #chips { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); display: none; gap: 8px; }
  #chips.on { display: flex; }
  #chips button { height: 38px; padding: 0 14px; border-radius: 19px; font: 700 14px var(--mono); display: inline-flex; align-items: center; gap: 8px; border-color: var(--c); }
  #chips button i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--c); }
  #chips button[aria-pressed="true"] { background: var(--neon); color: var(--on-neon); border-color: var(--neon); box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); }
  #chips button[aria-pressed="true"] i { border-color: var(--on-neon); }

  #card {
    position: fixed; z-index: 3; width: min(360px, 88vw); padding: 18px 20px 16px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    box-shadow: 0 10px 40px color-mix(in srgb, var(--bg) 50%, transparent), var(--panel-glow);
    backdrop-filter: blur(6px); pointer-events: none;
    opacity: 0; transform: translateY(6px); transition: opacity .18s ease, transform .18s ease;
  }
  #card.on { opacity: 1; transform: none; }
  #card.quiet { border-color: color-mix(in srgb, var(--gray) 55%, transparent); box-shadow: 0 10px 40px color-mix(in srgb, var(--bg) 50%, transparent); }
  #card .tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    background: var(--neon); color: var(--on-neon); }
  #card.quiet .tag { background: var(--gray); }
  #card h2 { margin: 8px 0 10px; font: 700 22px/1.15 var(--mono); color: var(--neon); word-break: break-word; }
  #card.quiet h2 { color: var(--ink); }
  #card code { display: block; padding: 7px 10px; border-radius: 8px; background: var(--code-bg);
    color: var(--code-ink); font: 400 13px/1.4 var(--mono); margin-bottom: 12px; word-break: break-word; }
  #card p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  @media (max-width: 700px) {
    #card { left: 16px !important; right: 16px; top: auto !important; bottom: 100px; width: auto; }
    .hud.tl { left: 16px; top: 18px; }
    #cap { font-size: 13px; bottom: 80px; }
  }
  @media (prefers-reduced-motion: reduce) { #card, #nav button, #tools button, #chips button { transition: none; } }

  /* ---- the stage: one state per scene (data-scene), moved only by classes and transitions ---- */
  #stage { position: fixed; left: 0; right: 0; top: var(--top, 170px); bottom: var(--bot, 130px); touch-action: pan-y; }
  .wrap { position: relative; height: 100%; width: min(1100px, calc(100% - 2 * var(--pad, 32px))); margin: 0 auto; }
  .layer { position: absolute; inset: 0; transition: opacity .3s ease; }
  #modesLayer { opacity: 0; pointer-events: none; }
  [data-scene="4"] #wordsLayer { opacity: 0; pointer-events: none; }
  [data-scene="4"] #modesLayer { opacity: 1; pointer-events: auto; transition-delay: .25s; }

  /* words */
  #words { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 16px; row-gap: 10px; align-content: start; }
  .wcol { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
  .ps { height: calc(var(--rows) * (var(--ph) + var(--pg))); }   /* the room for the clip pills above a card */
  .word { position: relative; font: inherit; color: var(--ink); text-align: center; cursor: pointer; height: var(--cardh); padding: 0;
    border-radius: 14px; border: 1.3px solid var(--link); background: color-mix(in srgb, var(--bg-glow) 85%, transparent);
    transition: background .2s, border-color .2s, color .2s, box-shadow .2s, opacity .5s, transform .5s; -webkit-tap-highlight-color: transparent; }
  .word:hover, .word:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 40%, transparent); outline: none; }
  .word .n { position: absolute; left: 14px; top: 12px; font: 700 12px var(--mono); color: var(--muted); }
  .word { display: flex; align-items: center; justify-content: center; }
  .word b { display: block; font: 700 var(--wsz, 28px)/1 var(--mono); }
  .word small { position: absolute; left: 0; right: 0; bottom: 12px; font: 12px var(--mono); color: var(--muted); }
  .word.sel { background: var(--neon); border-color: var(--neon); color: var(--on-neon); }
  .word.sel .n, .word.sel small { color: var(--on-neon); }
  .intro .word { animation: rise .5s ease both; animation-delay: calc(var(--i) * .26s + .12s); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* the detail of a tapped word (scene 1) */
  #detail { position: absolute; left: 0; right: 0; bottom: 0; top: var(--dtop, 60%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 20px;
    border-radius: 14px; border: 1.1px solid var(--dim); background: color-mix(in srgb, var(--bg-glow) 50%, transparent); opacity: 0; pointer-events: none; transition: opacity .3s, border-color .3s; }
  [data-scene="1"] #detail { opacity: 1; }
  #detail.has { border-color: var(--panel-border); }
  #detail .big { font: 700 clamp(34px, 5vw, 56px)/1.1 var(--head); color: var(--neon); }
  #detail .act { margin-top: 8px; font: 400 clamp(14px, 1.6vw, 19px)/1.4 var(--mono); color: var(--ink); }
  #detail .hint { color: var(--muted); font: 14px var(--mono); }

  /* clips: small pills with a mini waveform inside */
  #pills { position: absolute; inset: 0; pointer-events: none; }
  .pill { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); box-sizing: border-box; border: 1px solid var(--gray); border-radius: 999px;
    background: color-mix(in srgb, var(--gray) 14%, transparent); transform: translate(var(--hx), var(--hy)); opacity: 0;
    transition: opacity .25s ease, transform .6s cubic-bezier(.2, .7, .2, 1), border-color .4s, background .4s; }
  .pill svg { display: block; width: 100%; height: 100%; transition: opacity .3s; }
  .pill path { fill: none; stroke: var(--gray); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
  [data-scene="2"] .pill { opacity: 1; transition-delay: var(--d), 0s, 0s, 0s; }
  [data-scene="3"] .pill { opacity: .5; }
  [data-scene="4"] .pill { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(var(--sx), var(--sy)); border-color: var(--link); background: var(--link); transition-delay: 0s, var(--fd), var(--fd), var(--fd); }
  [data-scene="4"] .pill svg { opacity: 0; }
  [data-scene="4"] .pill.x { opacity: 0; transition-delay: calc(var(--fd) + .45s), var(--fd), 0s, 0s; }

  /* lines and people (scene 3) */
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #lines path { fill: none; stroke: var(--link); stroke-width: 1.2; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: .55; transition: stroke-dashoffset .6s ease, opacity .25s, stroke .25s; }
  [data-scene="3"] #lines path { stroke-dashoffset: 0; transition-delay: var(--ld), 0s, 0s; }
  [data-scene="3"] #lines.pick path { opacity: .12; }
  [data-scene="3"] #lines.pick path.sel { opacity: 1; stroke: var(--neon); stroke-width: 2; }
  #people { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
  .person { display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; opacity: 0; transform: translateY(24px);
    transition: opacity .4s, transform .4s; -webkit-tap-highlight-color: transparent; }
  [data-scene="3"] .person { opacity: 1; transform: none; transition-delay: var(--pd); pointer-events: auto; }
  .person { pointer-events: none; }
  .dotc { width: var(--pr, 52px); height: var(--pr, 52px); border-radius: 50%; display: grid; place-items: center; font: 700 22px var(--mono);
    background: color-mix(in srgb, var(--bg-glow) 95%, transparent); border: 1.4px solid var(--gray); transition: background .2s, border-color .2s, color .2s; }
  .person.sel .dotc { background: var(--neon); border-color: var(--neon); color: var(--on-neon); }
  .pname { display: inline-block; overflow: hidden; white-space: nowrap; width: 0; font: 14px var(--mono); }
  [data-scene="3"] .pname { width: calc(var(--n) * 1ch); transition: width .5s steps(var(--n)) calc(var(--pd) + .3s); }
  .person.sel .pname { color: var(--neon); font-weight: 700; }
  #stat { position: absolute; left: 0; right: 0; bottom: -26px; text-align: center; font: 700 14px var(--mono); color: var(--neon); opacity: 0; transition: opacity .25s; pointer-events: none; }
  #stat.on { opacity: 1; }
  [data-scene="3"] #stat { }
  [data-scene]:not([data-scene="3"]) #stat { opacity: 0; }

  /* the recording modes (scene 4) */
  #modesTop { display: flex; justify-content: space-between; height: 20px; font: 12px var(--mono); color: var(--muted); }
  #modesTop b { color: var(--neon); }
  #modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .mode { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 14px; min-width: 0; font: inherit; text-align: left; color: var(--ink); cursor: pointer;
    border-radius: 12px; border: 1.2px solid var(--link); background: color-mix(in srgb, var(--bg-glow) 85%, transparent); transition: border-color .2s, background .2s; -webkit-tap-highlight-color: transparent; }
  .mode.on { border-color: var(--neon); background: color-mix(in srgb, var(--neon) 10%, var(--bg-glow)); }
  .mode .lab { font: 700 12.5px/1.35 var(--mono); min-height: 2.7em; }
  .mode.on .lab { color: var(--neon); }
  .ill { position: relative; height: 62px; }
  .mic, .who { position: absolute; top: 4px; width: 22px; height: 40px; color: var(--gray); }
  .who { color: var(--ink); left: calc(30px + var(--f) * (100% - 62px)); }
  .mic { left: 0; }
  .dist { position: absolute; top: 46px; font: 11.5px var(--mono); color: var(--muted); transform: translateX(-50%); white-space: nowrap; left: calc(41px + var(--f) * (100% - 62px)); }
  .wv { position: absolute; left: 26px; top: 4px; height: 40px; width: calc(var(--f) * (100% - 62px) - 4px); overflow: hidden; }
  .wv svg { width: 100%; height: 100%; display: block; overflow: hidden; }
  .wv .flat { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 3 3; }
  .wv .w, .wv .nz { fill: none; stroke: var(--neon); stroke-width: 1.8; stroke-linejoin: round; opacity: 0; transition: opacity .25s; }
  .wv .nz { stroke-width: 1.2; }
  .mode.on .wv .w, .mode.on .wv .nz { opacity: 1; }
  .mode.on .wv .flat { opacity: 0; }
  .wv g.s { animation: wvmove 1.1s linear infinite; animation-play-state: paused; }
  .wv g.z { animation: wvmove 0.45s linear infinite; animation-play-state: paused; }
  .mode.on .wv g { animation-play-state: running; }
  @keyframes wvmove { from { transform: translateX(0); } to { transform: translateX(-24px); } }
  .dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--dim); box-sizing: border-box; }
  .mode .cnt { font: 11.5px var(--mono); color: var(--muted); }
  .dist { }

  @media (max-width: 699px) {
    #words { grid-template-columns: repeat(2, 1fr); column-gap: 10px; row-gap: 8px; }
    #modes { grid-template-columns: 1fr; gap: 6px; }
    .mode { display: grid; grid-template-columns: 38% 1fr; grid-template-rows: auto auto; column-gap: 10px; row-gap: 4px; padding: 8px 10px; }
    .mode .lab { grid-row: 1 / 3; font-size: 11px; align-self: start; }
    .mode .cnt { grid-column: 2; grid-row: 2; }
    .mode .dots { grid-column: 2; grid-row: 2; }
    .mode .cnt { display: none; }
    .ill { grid-column: 2; grid-row: 1; height: 38px; }
    .mic, .who { height: 28px; width: 16px; top: 2px; }
    .who { left: calc(22px + var(--f) * (100% - 46px)); }
    .wv { left: 20px; height: 28px; top: 2px; width: calc(var(--f) * (100% - 46px) - 4px); }
    .dist { top: 28px; font-size: 10px; left: calc(30px + var(--f) * (100% - 46px)); }
    .word small { display: none; }
    .word .n { top: 8px; left: 10px; }
    #modesTop { font-size: 10.5px; }
    .dotc { font-size: 18px; }
    .pname { font-size: 12px; }
    #detail .act { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="hud tl" id="hud">
  <a class="back" href="../index.html">← all blocks</a>
  <div class="kicker">What</div>
  <h1>Say a word, the laptop acts.</h1>
  <div class="sub">tap to explore</div>
</div>

<main id="stage" data-scene="1" aria-label="What: four spoken words, clips, four people, five ways to record">
  <div class="wrap">
    <div class="layer" id="wordsLayer">
      <svg id="lines" aria-hidden="true"></svg>
      <div id="words"></div>
      <div id="detail" aria-live="polite"></div>
      <div id="people"></div>
      <div id="stat"></div>
    </div>
    <div class="layer" id="modesLayer">
      <div id="modesTop"><b>recording protocol (planned)</b><span>illustrative waveform</span></div>
      <div id="modes"></div>
    </div>
    <div id="pills" aria-hidden="true"></div>
  </div>
</main>

<div id="cap" aria-live="polite"></div>
<nav id="nav" aria-label="Scenes">
  <button id="prev" type="button" aria-label="Previous scene">←</button>
  <div id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button id="next" type="button" aria-label="Next scene">→</button>
  <a id="onward" href="../index.html" hidden>Main screen →</a>
</nav>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   Data. Every number on the page is computed from these constants.
------------------------------------------------------------------ */
const WORDS = [
  { word: 'telegram', action: 'opens Telegram' },
  { word: 'elly',     action: 'opens the course site' },
  { word: 'slack',    action: 'opens Slack' },
  { word: 'focus',    action: 'closes everything except VS Code and Safari, turns on Do Not Disturb' },
];
const PEOPLE = ['Franc', 'Olga', 'Vova', 'Anna'];
const MODES = [
  { id: 1, label: 'In silence, in front of you',      count: 8, distance: 'in front', voice: 'normal', noise: false },
  { id: 2, label: 'In silence, at 1 m',               count: 6, distance: '1 m',      voice: 'normal', noise: false },
  { id: 3, label: 'In silence, at 2 m',               count: 4, distance: '2 m',      voice: 'normal', noise: false },
  { id: 4, label: 'In silence, in front, half voice', count: 4, distance: 'in front', voice: 'low',    noise: false },
  { id: 5, label: 'With background sound, at 1 m',    count: 7, distance: '1 m',      voice: 'normal', noise: true },
];
const DIST_M = { 'in front': 0.5, '1 m': 1, '2 m': 2 };   // metres, drawn in proportion
const LOW_VOICE_GAIN = 0.5;

const PER_WORD_PER_PERSON = MODES.reduce((a, m) => a + m.count, 0);   // 29 clips per word, per person
const PER_PERSON = PER_WORD_PER_PERSON * WORDS.length;                // 116
const TOTAL = PER_PERSON * PEOPLE.length;                             // 464

const CAPTIONS = [
  'Say one of four words. The laptop opens an app or closes the distractions.',
  `${PER_WORD_PER_PERSON} one-second clips per word, per person`,
  'Four people say every word, so the model learns the word, not one voice.',
  'Distance, volume and noise change. The model must work in a classroom, not only in silence.',
];
const NSCENES = CAPTIONS.length;
const SVGNS = 'http://www.w3.org/2000/svg';

const $ = id => document.getElementById(id);
const stage = $('stage'), capEl = $('cap'), hudEl = $('hud');
const prevBtn = $('prev'), nextBtn = $('next'), onwardEl = $('onward');
const dots = [...document.querySelectorAll('#dots i')];
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let scene = 1, sel = { word: -1, person: -1 };

function makeRng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rng = makeRng(42);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const sv = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); Object.keys(attrs || {}).forEach(k => e.setAttribute(k, attrs[k])); return e; };

/* ------------------------------------------------------------------
   Build the DOM once. After this, scenes only toggle data-scene.
------------------------------------------------------------------ */
// words
const wordsEl = $('words'), wcols = [];
WORDS.forEach((w, i) => {
  const col = el('div', 'wcol'), ps = el('div', 'ps'), b = el('button', 'word');
  b.type = 'button'; b.style.setProperty('--i', i);
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><b>${w.word}</b><small>keyword</small>`;
  b.addEventListener('click', () => { if (scene !== 1) return; sel.word = sel.word === i ? -1 : i; syncWords(); });
  col.append(ps, b); wordsEl.appendChild(col); wcols.push({ col, ps, b });
});
function syncWords() {
  wcols.forEach((c, i) => c.b.classList.toggle('sel', sel.word === i));
  const d = $('detail'), w = WORDS[sel.word];
  d.classList.toggle('has', !!w);
  d.innerHTML = w ? `<div class="big">“${w.word}”</div><div class="act">→ ${w.action}</div>` : '<div class="hint">tap a word</div>';
}

// clip pills: PER_WORD_PER_PERSON per word, each with its own little waveform
const pillsEl = $('pills'), pills = [];
function waveD(k) {
  const g = makeRng(1000 + k), A = 1.2 + g() * 2.2, f = 0.5 + g() * .6, ph = g() * 6.28, pts = [];
  for (let x = 3; x <= 25; x += 1.5) pts.push(`${x.toFixed(1)},${(5 + Math.sin(x * f + ph) * A * Math.sin(Math.PI * (x - 3) / 22)).toFixed(2)}`);
  return 'M' + pts.join(' L');
}
WORDS.forEach((_, w) => {
  for (let k = 0; k < PER_WORD_PER_PERSON; k++) {
    const p = el('div', 'pill' + (w ? ' x' : '')), s = sv('svg', { viewBox: '0 0 28 10', preserveAspectRatio: 'none' });
    s.appendChild(sv('path', { d: waveD(k * 7 + w) })); p.appendChild(s);
    p.style.setProperty('--fd', Math.round(rng() * 260) + 'ms');
    pillsEl.appendChild(p); pills.push({ el: p, w, k });
  }
});

// lines and people
const linesEl = $('lines'), peopleEl = $('people'), people = [], lines = [];
PEOPLE.forEach((name, j) => {
  const b = el('button', 'person'); b.type = 'button'; b.style.setProperty('--pd', ((j * WORDS.length + WORDS.length - 1) * 70 + 450) + 'ms'); b.style.setProperty('--n', name.length);
  b.innerHTML = `<span class="dotc">${name[0]}</span><span class="pname">${name}</span>`;
  b.addEventListener('click', () => { if (scene !== 3) return; sel.person = sel.person === j ? -1 : j; syncPeople(); });
  peopleEl.appendChild(b); people.push(b);
  WORDS.forEach((_, i) => { const p = sv('path', { pathLength: 1 }); p.style.setProperty('--ld', ((j * WORDS.length + i) * 70) + 'ms'); linesEl.appendChild(p); lines.push({ el: p, i, j }); });
});
function syncPeople() {
  people.forEach((b, j) => b.classList.toggle('sel', sel.person === j));
  lines.forEach(l => l.el.classList.toggle('sel', sel.person === l.j));
  linesEl.classList.toggle('pick', sel.person >= 0);
  const st = $('stat'); st.textContent = sel.person >= 0 ? `${PER_WORD_PER_PERSON} clips per word × ${WORDS.length} words = ${PER_PERSON} clips` : '';
  st.classList.toggle('on', sel.person >= 0);
}

// recording modes: a card with an illustration, a waveform that can be played, and one dot per recording
const modesEl = $('modes'), dotsOf = [], MAXD = Math.max(...Object.values(DIST_M)), MIND = Math.min(...Object.values(DIST_M));
const gainOf = m => ((1 / (1 + DIST_M[m.distance])) / (1 / (1 + MIND))) * (m.voice === 'low' ? LOW_VOICE_GAIN : 1);   // farther or quieter: smaller wave
const MIC = '<svg class="mic" viewBox="0 0 22 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="2" width="10" height="18" rx="5"/><path d="M2 16a9 9 0 0 0 18 0M11 25v9M6 36h10"/></svg>';
const WHO = '<svg class="who" viewBox="0 0 22 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="9" r="6"/><path d="M1 38a10 10 0 0 1 20 0"/></svg>';
function wavePath(amp, f, seed, noisy) {
  const g = makeRng(seed), pts = []; const step = noisy ? 1.2 : 2;
  for (let x = 0; x <= 168; x += step) {
    const y = noisy ? 20 + (g() - .5) * amp * 1.7 : 20 + Math.sin(x * f) * amp;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return 'M' + pts.join(' L');
}
MODES.forEach((m, i) => {
  const b = el('button', 'mode'); b.type = 'button'; b.style.setProperty('--f', (DIST_M[m.distance] / MAXD).toFixed(3));
  const amp = 15 * gainOf(m) / 1;   // wave height in svg units (the svg is 40 high)
  b.innerHTML = `<span class="lab">${m.id}. ${m.label}</span>` +
    `<span class="ill">${MIC}${WHO}<span class="wv"><svg viewBox="0 0 120 40" preserveAspectRatio="none"><line class="flat" x1="0" y1="20" x2="120" y2="20"/>` +
    `<g class="s"><path class="w" d="${wavePath(amp, 2 * Math.PI / 24, 1, false)}"/></g>` +
    (m.noise ? `<g class="z"><path class="nz" d="${wavePath(14, 0, 77, true)}"/></g>` : '') + `</svg></span><span class="dist">${m.distance}</span></span>`;
  const row = el('span', 'dots'), mine = [];
  for (let k = 0; k < m.count; k++) { const d = el('i'); row.appendChild(d); mine.push(d); dotsOf.push(d); }
  b.appendChild(row); b.appendChild(el('span', 'cnt', `${m.count} per word`));
  b.addEventListener('click', () => { if (scene !== 4) return; const on = !b.classList.contains('on'); modeCards.forEach(c => c.classList.remove('on')); b.classList.toggle('on', on); });
  modesEl.appendChild(b);
});
const modeCards = [...modesEl.children];

/* ------------------------------------------------------------------
   Layout: sizes into CSS variables, then the home and landing positions of the pills
------------------------------------------------------------------ */
function layout() {
  const narrow = innerWidth < 700, pad = narrow ? 16 : 32;
  const hudB = hudEl.getBoundingClientRect().bottom, capTop = capEl.getBoundingClientRect().top;
  stage.style.setProperty('--top', (hudB + 10) + 'px'); stage.style.setProperty('--bot', (innerHeight - capTop + 8) + 'px'); stage.style.setProperty('--pad', pad + 'px');
  const ppr = narrow ? 6 : 8, rows = Math.ceil(PER_WORD_PER_PERSON / ppr), pg = 3;
  stage.style.setProperty('--rows', rows); stage.style.setProperty('--pg', pg + 'px');
  // the card height and the width of a pill depend on the room
  const colW = (stage.querySelector('.wrap').clientWidth - (narrow ? 10 : 3 * 16)) / (narrow ? 2 : 4);
  const pw = narrow ? Math.min(24, Math.floor((colW - (ppr - 1) * pg) / ppr)) : 28, ph = narrow ? 9 : 10;
  stage.style.setProperty('--pw', pw + 'px'); stage.style.setProperty('--ph', ph + 'px');
  const stageH = stage.clientHeight, cardH = narrow ? 56 : clamp(stageH * .2, 100, 150);
  stage.style.setProperty('--cardh', cardH + 'px'); stage.style.setProperty('--wsz', (narrow ? 20 : 28) + 'px'); stage.style.setProperty('--pr', (narrow ? 40 : 52) + 'px');
  const wl = wordsEl.getBoundingClientRect(), wrapR = stage.querySelector('.wrap').getBoundingClientRect();
  stage.style.setProperty('--dtop', (wl.bottom - wrapR.top + 14) + 'px');
  // lines: from the bottom of each word to the top of each person
  const lr = linesEl.getBoundingClientRect(); linesEl.setAttribute('viewBox', `0 0 ${lr.width} ${lr.height}`);
  lines.forEach(l => {
    const a = wcols[l.i].b.getBoundingClientRect(), b = people[l.j].querySelector('.dotc').getBoundingClientRect();
    l.el.setAttribute('d', `M${a.left + a.width / 2 - lr.left},${a.bottom - lr.top} L${b.left + b.width / 2 - lr.left},${b.top - lr.top}`);
  });
  // pills: home above the word cards, landing spots over the dots of the mode cards
  const o = pillsEl.getBoundingClientRect(), gw = ppr * pw + (ppr - 1) * pg;
  pills.forEach(p => {
    const r = wcols[p.w].ps.getBoundingClientRect(), col = p.k % ppr, row = Math.floor(p.k / ppr);
    const hx = r.left - o.left + (r.width - gw) / 2 + col * (pw + pg), hy = r.bottom - o.top - (rows - row) * (ph + pg) + pg;
    const d = dotsOf[p.k].getBoundingClientRect(), dd = d.width;
    p.el.style.setProperty('--hx', hx.toFixed(1) + 'px'); p.el.style.setProperty('--hy', hy.toFixed(1) + 'px');
    p.el.style.setProperty('--tx', (d.left - o.left + d.width / 2 - pw / 2).toFixed(1) + 'px'); p.el.style.setProperty('--ty', (d.top - o.top + d.height / 2 - ph / 2).toFixed(1) + 'px');
    p.el.style.setProperty('--sx', (dd / pw).toFixed(3)); p.el.style.setProperty('--sy', (dd / ph).toFixed(3));
    // a wave from left to right: by column, then row
    p.el.style.setProperty('--d', (((p.w * ppr + col) + row) * 25) + 'ms');
  });
}

/* ------------------------------------------------------------------
   Scenes
------------------------------------------------------------------ */
function setScene(n, instant) {
  scene = clamp(n, 1, NSCENES);
  stage.dataset.scene = String(scene); document.body.dataset.scene = String(scene);
  dots.forEach((d, i) => d.classList.toggle('on', i === scene - 1));
  prevBtn.disabled = scene === 1; nextBtn.hidden = scene === NSCENES; onwardEl.hidden = scene !== NSCENES;
  capEl.textContent = CAPTIONS[scene - 1];
  if (scene !== 1 && sel.word >= 0) { sel.word = -1; syncWords(); }
  if (scene !== 3) { sel.person = -1; syncPeople(); }
  if (scene !== 4) modeCards.forEach(c => c.classList.remove('on'));
  layout();
}
prevBtn.addEventListener('click', () => setScene(scene - 1)); nextBtn.addEventListener('click', () => setScene(scene + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') setScene(scene + 1); else if (e.key === 'ArrowLeft') setScene(scene - 1); });
addEventListener('resize', layout);

// one-finger swipe changes the scene; the click that follows a swipe is ignored
let down = null, swiped = false;
stage.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, type: e.pointerType }; swiped = false; });
stage.addEventListener('pointercancel', () => { down = null; });
stage.addEventListener('pointerup', e => {
  if (!down) return; const d = down; down = null; const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (d.type !== 'mouse' && Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swiped = true; setScene(scene + (dx < 0 ? 1 : -1)); }
});
stage.addEventListener('click', e => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);

syncWords(); syncPeople();
setScene(1);
document.fonts && document.fonts.ready.then(layout);
if (!reduce) { document.body.classList.add('intro'); setTimeout(() => document.body.classList.remove('intro'), 1600); }

window.__what = { scene: () => scene, totals: () => ({ perWordPerPerson: PER_WORD_PER_PERSON, perPerson: PER_PERSON, total: TOTAL }), go: setScene, pills: () => pills.length, dots: () => dotsOf.length };
})();
</script>
<script src="../_shared/tapstep.js"></script>
</body>
</html>
