<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What</title>
<link rel="stylesheet" href="../_shared/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { background: var(--page-bg); }
  button { font: inherit; color: inherit; }

  .hud { position: fixed; pointer-events: none; z-index: 2; top: 28px; left: 32px; right: 32px; }
  .back { display: inline-block; margin: 0 0 12px; padding: 8px 14px; border: 1px solid var(--neon); border-radius: 999px; color: var(--ink); font-size: 14px; text-decoration: none; pointer-events: auto;
    transition: box-shadow .2s, background .2s, color .2s; }
  .back:hover, .back:focus-visible { box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 45%, transparent); outline: none; }
  .back:active { background: var(--neon); color: var(--on-neon); }
  .kicker { font: 700 14px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--neon); }
  h1 { margin: 6px 0 0; font: 700 clamp(26px, 3.6vw, 46px)/1.12 var(--head); letter-spacing: -.01em; }

  /* the stage is the room between the question and the caption; every scene fills it and centres its content */
  #stage { position: fixed; left: 0; right: 0; top: var(--top, 150px); bottom: var(--bot, 130px); touch-action: pan-y; }
  .scene { position: absolute; left: 50%; top: 0; bottom: 0; width: min(1100px, calc(100% - 64px)); transform: translateX(-50%); display: flex; flex-direction: column; justify-content: center; gap: 14px;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s .3s; }
  .scene.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .3s ease, visibility 0s; }

  /* one caption, one place; progress next to the dots */
  #cap { position: fixed; z-index: 2; left: 50%; bottom: 84px; transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); text-align: center; font-size: 16px; line-height: 1.4; color: var(--ink); pointer-events: none; min-height: 22px; }
  #nav { position: fixed; z-index: 4; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; }
  #prev, #next, #onward { cursor: pointer; font: inherit; color: var(--ink); background: color-mix(in srgb, var(--bg-glow) 72%, transparent); border: 1px solid var(--neon); display: grid; place-items: center; padding: 0; }
  #prev { width: 44px; height: 44px; border-radius: 50%; } #next { width: 76px; height: 54px; border-radius: 27px; font-size: 26px; }
  #onward { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 22px; white-space: nowrap; font-size: 14px; text-decoration: none; }
  #prev:disabled { opacity: .3; } #next[hidden], #onward[hidden] { display: none; }
  #dots { display: flex; gap: 8px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); transition: background .2s, box-shadow .2s, border-color .2s; }
  #dots i.on { background: var(--neon); border-color: var(--neon); box-shadow: 0 0 8px var(--neon); }
  #prog { font: 14px var(--mono); color: var(--muted); min-width: 3.4em; }

  /* scene 1: four words, the action sits inside the card */
  #words { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: center; }
  .wcard { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: min(36vh, 300px); padding: 20px 18px; border-radius: 16px; border: 1.3px solid var(--link); background: color-mix(in srgb, var(--bg-glow) 85%, transparent);
    text-align: center; cursor: pointer; transition: background .25s, border-color .25s, color .25s, box-shadow .25s, opacity .5s, transform .5s; -webkit-tap-highlight-color: transparent; opacity: 0; transform: translateY(16px); }
  .scene.on .wcard { opacity: 1; transform: none; transition-delay: 0s, 0s, 0s, 0s, calc(var(--i) * .12s), calc(var(--i) * .12s); }
  .wcard:hover, .wcard:focus-visible { box-shadow: 0 0 16px color-mix(in srgb, var(--neon) 40%, transparent); outline: none; }
  .wcard b { font: 700 clamp(26px, 3.2vw, 42px)/1.1 var(--mono); }
  .wcard .act { font: 16px/1.4 var(--mono); color: var(--muted); }
  .wcard .res { max-height: 0; overflow: hidden; opacity: 0; font: 700 16px/1.4 var(--mono); transition: max-height .35s ease, opacity .3s; }
  .wcard.sel { background: var(--neon); border-color: var(--neon); color: var(--on-neon); }
  .wcard.sel .act { color: var(--on-neon); }
  .wcard.sel .res { max-height: 8em; opacity: 1; padding-top: 10px; border-top: 1px solid var(--on-neon); }

  /* scene 2: the recordings of one word */
  .s2 { flex-direction: row; align-items: center; justify-content: center; gap: 32px; }
  #tabs { display: flex; flex-direction: column; gap: clamp(10px, 2.4vh, 22px); width: 210px; flex: none; }
  .tab { height: clamp(48px, 8vh, 72px); padding: 0 16px; border-radius: 24px; border: 1.3px solid var(--link); background: color-mix(in srgb, var(--bg-glow) 72%, transparent); font: 700 16px var(--mono); text-align: left; cursor: pointer;
    transition: background .2s, color .2s, border-color .2s; -webkit-tap-highlight-color: transparent; }
  .tab[aria-pressed="true"] { background: var(--neon); border-color: var(--neon); color: var(--on-neon); }
  .recs { min-width: 0; }
  #count { font: 17px/1.4 var(--mono); color: var(--muted); margin: 0 0 clamp(14px, 3vh, 30px); } #count b { color: var(--neon); }
  #grid { display: grid; grid-template-columns: repeat(8, 64px); gap: clamp(14px, 4vh, 38px) 14px; }
  .rec { width: 64px; height: 28px; padding: 0; border-radius: 999px; border: 1px solid var(--link); background: color-mix(in srgb, var(--link) 10%, transparent); cursor: pointer; transition: border-color .2s, background .2s, box-shadow .2s; -webkit-tap-highlight-color: transparent; }
  .rec svg { display: block; width: 100%; height: 100%; }
  .rec path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.3; }
  .rec .base { stroke: var(--link); } .rec .live { stroke: var(--neon); stroke-dasharray: 1; stroke-dashoffset: 1; }
  .rec:hover, .rec:focus-visible { border-color: var(--neon); outline: none; }
  .rec.play { border-color: var(--neon); background: color-mix(in srgb, var(--neon) 14%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--neon) 40%, transparent); }
  .rec.play .live { stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
  .fresh .rec { animation: rise .4s ease both; animation-delay: var(--d); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* scene 3: who says them */
  #tbl { display: grid; grid-template-columns: 170px repeat(4, minmax(0, 1fr)) 130px; grid-template-rows: 44px repeat(5, minmax(46px, 1fr)); gap: 6px; flex: 1; max-height: 430px; min-height: 0; }
  #tbl > div { display: flex; align-items: center; justify-content: center; border-radius: 10px; min-width: 0; text-align: center; }
  #tbl .h { font: 700 15px var(--body); color: var(--muted); line-height: 1.15; }
  #tbl .who { display: flex; align-items: center; justify-content: flex-start; gap: 12px; padding-left: 8px; background: none; border: 0; cursor: pointer; font: 700 16px var(--mono); color: var(--ink); border-radius: 26px; transition: background .2s; }
  #tbl .who:hover { background: color-mix(in srgb, var(--neon) 8%, transparent); }
  .av { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 700 18px var(--mono); background: color-mix(in srgb, var(--bg-glow) 95%, transparent); border: 1.4px solid var(--gray); transition: background .2s, color .2s, border-color .2s; }
  #tbl .cell { border: 1px solid var(--dim); background: color-mix(in srgb, var(--link) 8%, transparent); transition: background .2s, border-color .2s; }
  #tbl .cell b { font: 700 clamp(18px, 2.4vw, 26px) var(--mono); }
  #tbl .tot { font: 700 clamp(16px, 2vw, 22px) var(--mono); color: var(--neon); flex-direction: column; line-height: 1.1; }
  #tbl .tot small { font: 700 14px var(--body); color: var(--muted); }
  #tbl .hl { background: color-mix(in srgb, var(--neon) 16%, transparent); border-color: var(--neon); }
  #tbl .who.hl { background: color-mix(in srgb, var(--neon) 10%, transparent); border: 1px solid var(--neon); } #tbl .who.hl .av { background: var(--neon); border-color: var(--neon); color: var(--on-neon); }
  .filled .cell b { animation: flash .7s ease both; animation-delay: var(--d); }
  @keyframes flash { 0% { opacity: 0; transform: scale(1.5); text-shadow: 0 0 18px var(--neon); } 45% { opacity: 1; transform: scale(1); text-shadow: 0 0 18px var(--neon); } 100% { opacity: 1; transform: none; text-shadow: none; } }
  #whoLine { min-height: 24px; text-align: center; font: 700 17px var(--mono); color: var(--neon); }

  /* scene 4: five recording modes and the strip of 29 */
  #modesTop { display: flex; align-items: center; gap: 12px; font: 700 15px var(--mono); }
  .chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--gray); color: var(--muted); font: 14px var(--mono); }
  #modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; flex: 1; max-height: 320px; min-height: 0; }
  .mode { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 14px 14px 16px; min-width: 0; text-align: left; cursor: pointer; border-radius: 14px; border: 1.2px solid var(--mc); background: color-mix(in srgb, var(--bg-glow) 85%, transparent);
    opacity: 0; transform: translateY(14px); transition: border-color .2s, background .2s, opacity .5s, transform .5s; -webkit-tap-highlight-color: transparent; }
  .scene.on .mode { opacity: 1; transform: none; transition-delay: 0s, 0s, calc(var(--mi) * .14s + .2s), calc(var(--mi) * .14s + .2s); }
  .mode.on { border-color: var(--neon); background: color-mix(in srgb, var(--neon) 10%, var(--bg-glow)); }
  .mode .lab { font: 700 15px/1.3 var(--mono); }
  .mode.on .lab { color: var(--neon); }
  .mode .cnt { font: 700 clamp(26px, 3vw, 38px) var(--mono); color: var(--mc); }
  .mode.on .cnt { color: var(--neon); }
  .ill { position: relative; height: 74px; flex: none; }
  .mic, .who2 { position: absolute; top: 2px; width: 24px; height: 44px; color: var(--gray); }
  .who2 { color: var(--ink); left: calc(34px + var(--f) * (100% - 68px)); } .mic { left: 0; }
  .dist { position: absolute; top: 50px; font: 14px var(--mono); color: var(--muted); transform: translateX(-50%); white-space: nowrap; left: calc(46px + var(--f) * (100% - 68px)); }
  .wv { position: absolute; left: 30px; top: 2px; height: 44px; width: calc(var(--f) * (100% - 68px) - 4px); overflow: hidden; }
  .wv svg { width: 100%; height: 100%; display: block; }
  .wv .flat { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 3 3; }
  .wv .w, .wv .nz { fill: none; stroke: var(--neon); stroke-width: 1.8; stroke-linejoin: round; opacity: 0; transition: opacity .25s; } .wv .nz { stroke-width: 1.2; }
  .mode.on .wv .w, .mode.on .wv .nz { opacity: 1; } .mode.on .wv .flat { opacity: 0; }
  .wv g.s { animation: wvmove 1.1s linear infinite; animation-play-state: paused; } .wv g.z { animation: wvmove .45s linear infinite; animation-play-state: paused; }
  .mode.on .wv g { animation-play-state: running; }
  @keyframes wvmove { from { transform: translateX(0); } to { transform: translateX(-24px); } }
  #strip { display: flex; gap: 4px; }
  #strip i { flex: 1; height: 26px; border-radius: 5px; background: var(--mc); opacity: 0; transition: opacity .4s, transform .2s; }
  .scene.on #strip i { opacity: 1; transition-delay: calc(var(--mi) * .14s + .5s), 0s; }
  #strip.pick i { opacity: .25; transition-delay: 0s; } #strip.pick i.on { opacity: 1; background: var(--neon); }
  #stripLab { text-align: center; font: 700 16px var(--mono); color: var(--muted); }

  @media (max-width: 699px) {
    .hud { left: 16px; right: 16px; top: 18px; }
    .scene { width: calc(100% - 32px); gap: 10px; }
    #cap { font-size: 14px; bottom: 76px; }
    h1 { font-size: 24px; }
    #words { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .wcard { min-height: 17vh; padding: 14px 10px; } .wcard .act, .wcard .res { font-size: 14px; }
    .s2 { flex-direction: column; align-items: stretch; gap: 12px; }
    #tabs { flex-direction: row; width: auto; gap: 6px; } .tab { flex: 1; padding: 0 6px; height: 42px; font-size: 14px; text-align: center; }
    #grid { grid-template-columns: repeat(5, 1fr); gap: 10px 8px; } .rec { width: 100%; }
    #count { font-size: 14px; margin-bottom: 10px; }
    #tbl { grid-template-columns: 42px repeat(4, minmax(0, 1fr)) 68px; gap: 4px; max-height: 360px; }
    #tbl .who { padding: 0; justify-content: center; } #tbl .who span:last-child { display: none; }
    #tbl .h { font-size: 14px; } .av { width: 36px; height: 36px; }
    #modes { grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: none; }
    #modes .mode:last-child { grid-column: 1 / -1; }
    .mode { padding: 10px; gap: 4px; justify-content: flex-start; } .mode .lab { font-size: 14px; padding-right: 34px; min-height: 2.6em; } .ill { height: 54px; }
    .mic, .who2 { height: 36px; width: 20px; } .dist { top: 38px; }
    .mode .cnt { position: absolute; top: 8px; right: 10px; font-size: 22px; }
    #modesTop { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .rec.play .live { stroke-dashoffset: 0; } }
</style>
</head>
<body>

<div class="hud" id="hud">
  <a class="back" href="../index.html">← all blocks</a>
  <div class="kicker" id="kicker">What</div>
  <h1 id="q"></h1>
</div>

<main id="stage" data-scene="1" aria-label="What: four spoken words, the recordings, four people, five ways to record">
  <section class="scene" id="s1"><div id="words"></div></section>
  <section class="scene s2" id="s2">
    <div id="tabs" role="tablist" aria-label="Word"></div>
    <div class="recs"><div id="count" aria-live="polite"></div><div id="grid"></div></div>
  </section>
  <section class="scene" id="s3"><div id="tbl"></div><div id="whoLine" aria-live="polite"></div></section>
  <section class="scene" id="s4">
    <div id="modesTop"><span>recording protocol</span><span class="chip">in progress</span></div>
    <div id="modes"></div>
    <div id="strip"></div><div id="stripLab"></div>
  </section>
</main>

<div id="cap" aria-live="polite"></div>
<nav id="nav" aria-label="Scenes">
  <button id="prev" type="button" aria-label="Previous scene">←</button>
  <div id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <span id="prog" aria-hidden="true"></span>
  <button id="next" type="button" aria-label="Next scene">→</button>
  <a id="onward" href="../index.html" hidden>Main screen →</a>
</nav>

<script>
(() => {
'use strict';

/* Data. Every number on the page is computed from these constants. */
const WORDS = [
  { word: 'telegram', action: 'opens Telegram',                                  result: 'Telegram opens.' },
  { word: 'elly',     action: 'opens the course page',                           result: 'The course page opens in the browser.' },
  { word: 'slack',    action: 'opens Slack',                                     result: 'Slack opens.' },
  { word: 'focus',    action: 'closes distractions, turns on Do Not Disturb',    result: 'Distracting apps close. Do Not Disturb is on.' },
];
const PEOPLE = ['Franc', 'Olga', 'Vova', 'Anna'];
const MODES = [
  { id: 1, label: 'In silence, in front of you',      count: 8, distance: 'in front', voice: 'normal', noise: false, color: 'var(--neon)' },
  { id: 2, label: 'In silence, at 1 m',               count: 6, distance: '1 m',      voice: 'normal', noise: false, color: 'var(--link)' },
  { id: 3, label: 'In silence, at 2 m',               count: 4, distance: '2 m',      voice: 'normal', noise: false, color: 'var(--gray)' },
  { id: 4, label: 'In silence, in front, half voice', count: 4, distance: 'in front', voice: 'low',    noise: false, color: 'var(--ink)' },
  { id: 5, label: 'With background sound, at 1 m',    count: 7, distance: '1 m',      voice: 'normal', noise: true,  color: 'var(--code-ink)' },
];
const DIST_M = { 'in front': 0.5, '1 m': 1, '2 m': 2 };   // metres, drawn in proportion
const LOW_VOICE_GAIN = 0.5;
const PER_WORD_PER_PERSON = MODES.reduce((a, m) => a + m.count, 0);   // 29
const PER_PERSON = PER_WORD_PER_PERSON * WORDS.length;                // 116
const PER_WORD = PER_WORD_PER_PERSON * PEOPLE.length;                 // 116
const TOTAL = PER_PERSON * PEOPLE.length;                             // 464

const SCENES = [
  { q: 'What do you say?',                 cap: 'Say one of four words. The laptop does the rest.' },
  { q: 'What does the model learn from?',  cap: `Every word is recorded ${PER_WORD_PER_PERSON} times by each person.` },
  { q: 'Who says them?',                   cap: 'Four people say every word, so the model learns the word, not one voice.' },
  { q: 'How do we record?',                cap: 'Distance, volume and noise change. The model must work in a classroom, not only in silence.' },
];
const NSCENES = SCENES.length, SVGNS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const stage = $('stage'), capEl = $('cap'), hudEl = $('hud'), prevBtn = $('prev'), nextBtn = $('next'), onwardEl = $('onward');
const dots = [...document.querySelectorAll('#dots i')], scenes = [...document.querySelectorAll('.scene')];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const sv = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); Object.keys(attrs || {}).forEach(k => e.setAttribute(k, attrs[k])); return e; };
function makeRng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const restart = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };   // replays the CSS animations of a class

/* Scene 1: four words, a tap opens the result inside the card */
let selWord = -1; const wcards = [];
WORDS.forEach((w, i) => {
  const b = el('button', 'wcard'); b.type = 'button'; b.style.setProperty('--i', i);
  b.innerHTML = `<b>${w.word}</b><span class="act">→ ${w.action}</span><span class="res">✓ ${w.result}</span>`;
  b.addEventListener('click', () => { selWord = selWord === i ? -1 : i; wcards.forEach((c, k) => c.classList.toggle('sel', k === selWord)); });
  $('words').appendChild(b); wcards.push(b);
});

/* Scene 2: the recordings of one word. A tap plays <word>.mp3 from assets/audio/ when it exists; without the file the wave only animates. */
let selTab = 1; const tabs = [], noAudio = {}; let audio = null;
function waveD(seed) {
  const g = makeRng(seed), A = 3 + g() * 8, f = 0.35 + g() * .5, ph = g() * 6.28, pts = [];
  for (let x = 4; x <= 60; x += 2) pts.push(`${x},${(14 + Math.sin(x * f + ph) * A * Math.sin(Math.PI * (x - 4) / 56) * (.6 + .4 * g())).toFixed(2)}`);
  return 'M' + pts.join(' L');
}
function playRec(node, w) {
  document.querySelectorAll('.rec.play').forEach(n => n.classList.remove('play'));
  void node.offsetWidth; node.classList.add('play'); setTimeout(() => node.classList.remove('play'), 1100);
  if (audio) { audio.pause(); audio = null; }
  if (noAudio[w]) return;
  const a = new Audio('assets/audio/' + WORDS[w].word + '.mp3');
  a.addEventListener('error', () => { noAudio[w] = true; });
  const p = a.play(); if (p && p.catch) p.catch(() => { noAudio[w] = true; });
  audio = a;
}
function renderRecs() {
  const w = WORDS[selTab].word, grid = $('grid'); grid.innerHTML = '';
  tabs.forEach((t, i) => t.setAttribute('aria-pressed', i === selTab ? 'true' : 'false'));
  $('count').innerHTML = `<b>${PER_WORD_PER_PERSON} recordings</b> of “${w}” · 1 second each · 1 person`;
  for (let k = 0; k < PER_WORD_PER_PERSON; k++) {
    const b = el('button', 'rec'); b.type = 'button'; b.setAttribute('aria-label', `${w} recording ${k + 1}`); b.style.setProperty('--d', (k * 14) + 'ms');
    const s = sv('svg', { viewBox: '0 0 64 28', preserveAspectRatio: 'none' }), d = waveD(selTab * 100 + k);
    s.appendChild(sv('path', { class: 'base', d })); s.appendChild(sv('path', { class: 'live', d, pathLength: 1 })); b.appendChild(s);
    b.addEventListener('click', () => playRec(b, selTab)); grid.appendChild(b);
  }
  restart(grid, 'fresh');
}
WORDS.forEach((w, i) => { const t = el('button', 'tab', w.word); t.type = 'button'; t.setAttribute('role', 'tab'); t.addEventListener('click', () => { selTab = i; renderRecs(); }); $('tabs').appendChild(t); tabs.push(t); });

/* Scene 3: who says them: a 4 × 4 table filled cell by cell, with totals */
const tbl = $('tbl'), rowsEls = PEOPLE.map(() => []); let selPerson = -1;
tbl.appendChild(el('div', 'h'));
WORDS.forEach(w => tbl.appendChild(el('div', 'h', w.word)));
tbl.appendChild(el('div', 'h', 'per person'));
PEOPLE.forEach((name, j) => {
  const who = el('button', 'who'); who.type = 'button'; who.innerHTML = `<span class="av">${name[0]}</span><span>${name}</span>`; who.setAttribute('aria-label', name);
  who.addEventListener('click', () => { selPerson = selPerson === j ? -1 : j; syncPerson(); }); tbl.appendChild(who); rowsEls[j].push(who);
  WORDS.forEach((_, i) => { const c = el('div', 'cell'); c.style.setProperty('--d', ((j * WORDS.length + i) * 90 + 200) + 'ms'); c.appendChild(el('b', '', PER_WORD_PER_PERSON)); tbl.appendChild(c); rowsEls[j].push(c); });
  const t = el('div', 'cell tot'); t.style.setProperty('--d', ((j * WORDS.length + 3) * 90 + 500) + 'ms'); t.appendChild(el('b', '', PER_PERSON)); tbl.appendChild(t); rowsEls[j].push(t);
});
tbl.appendChild(el('div', 'h', 'per word'));
WORDS.forEach(() => { const t = el('div', 'cell tot'); t.style.setProperty('--d', '1700ms'); t.appendChild(el('b', '', PER_WORD)); tbl.appendChild(t); });
const corner = el('div', 'cell tot'); corner.style.setProperty('--d', '2000ms'); corner.innerHTML = `<b>${TOTAL}</b><small>recordings</small>`; tbl.appendChild(corner);
function syncPerson() {
  rowsEls.forEach((r, j) => r.forEach(c => c.classList.toggle('hl', j === selPerson)));
  $('whoLine').textContent = selPerson >= 0 ? `${PEOPLE[selPerson]}: ${WORDS.length} words × ${PER_WORD_PER_PERSON} = ${PER_PERSON}` : '';
}

/* Scene 4: five recording modes, the strip of 29 */
const modesEl = $('modes'), modeCards = [], strip = $('strip'), MAXD = Math.max(...Object.values(DIST_M)), MIND = Math.min(...Object.values(DIST_M));
const gainOf = m => ((1 / (1 + DIST_M[m.distance])) / (1 / (1 + MIND))) * (m.voice === 'low' ? LOW_VOICE_GAIN : 1);   // farther or quieter: smaller wave
const MIC = '<svg class="mic" viewBox="0 0 22 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="2" width="10" height="18" rx="5"/><path d="M2 16a9 9 0 0 0 18 0M11 25v9M6 36h10"/></svg>';
const WHO = '<svg class="who2" viewBox="0 0 22 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="9" r="6"/><path d="M1 38a10 10 0 0 1 20 0"/></svg>';
function wavePath(amp, f, seed, noisy) {
  const g = makeRng(seed), pts = [], step = noisy ? 1.2 : 2;
  for (let x = 0; x <= 168; x += step) pts.push(`${x.toFixed(1)},${(noisy ? 20 + (g() - .5) * amp * 1.7 : 20 + Math.sin(x * f) * amp).toFixed(1)}`);
  return 'M' + pts.join(' L');
}
let selMode = -1;
const segs = [];
MODES.forEach((m, i) => {
  const b = el('button', 'mode'); b.type = 'button'; b.style.setProperty('--f', (DIST_M[m.distance] / MAXD).toFixed(3)); b.style.setProperty('--mi', i); b.style.setProperty('--mc', m.color);
  b.innerHTML = `<span class="lab">${m.id}. ${m.label}</span>` +
    `<span class="ill">${MIC}${WHO}<span class="wv"><svg viewBox="0 0 120 40" preserveAspectRatio="none"><line class="flat" x1="0" y1="20" x2="120" y2="20"/>` +
    `<g class="s"><path class="w" d="${wavePath(15 * gainOf(m), 2 * Math.PI / 24, 1, false)}"/></g>` +
    (m.noise ? `<g class="z"><path class="nz" d="${wavePath(14, 0, 77, true)}"/></g>` : '') + `</svg></span><span class="dist">${m.distance}</span></span>` +
    `<span class="cnt">${m.count}×</span>`;
  b.addEventListener('click', () => { selMode = selMode === i ? -1 : i; syncModes(); });
  modesEl.appendChild(b); modeCards.push(b);
  for (let k = 0; k < m.count; k++) { const s = el('i'); s.style.setProperty('--mc', m.color); s.style.setProperty('--mi', i); strip.appendChild(s); segs.push({ s, i }); }
});
$('stripLab').textContent = `= ${PER_WORD_PER_PERSON} per word`;
function syncModes() {
  modeCards.forEach((c, i) => c.classList.toggle('on', i === selMode));
  strip.classList.toggle('pick', selMode >= 0); segs.forEach(g => g.s.classList.toggle('on', g.i === selMode));
}

/* Scenes */
let scene = 0;
function fit() {
  stage.style.setProperty('--top', (hudEl.getBoundingClientRect().bottom + 8) + 'px');
  stage.style.setProperty('--bot', (innerHeight - capEl.getBoundingClientRect().top + 8) + 'px');
}
function setScene(n) {
  n = clamp(n, 1, NSCENES); const was = scene; scene = n;
  stage.dataset.scene = String(n);
  scenes.forEach((s, i) => s.classList.toggle('on', i === n - 1));
  dots.forEach((d, i) => d.classList.toggle('on', i === n - 1));
  $('prog').textContent = `${n} / ${NSCENES}`;
  prevBtn.disabled = n === 1; nextBtn.hidden = n === NSCENES; onwardEl.hidden = n !== NSCENES;
  $('q').textContent = SCENES[n - 1].q; capEl.textContent = SCENES[n - 1].cap;
  if (n !== 1) { selWord = -1; wcards.forEach(c => c.classList.remove('sel')); }
  if (n !== 3) { selPerson = -1; syncPerson(); } else if (was !== 3) restart(tbl, 'filled');
  if (n !== 4) { selMode = -1; syncModes(); }
  if (n === 2 && was !== 2) restartRecs();
  fit();
}
const restartRecs = () => restart($('grid'), 'fresh');
prevBtn.addEventListener('click', () => setScene(scene - 1)); nextBtn.addEventListener('click', () => setScene(scene + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') setScene(scene + 1); else if (e.key === 'ArrowLeft') setScene(scene - 1); });
addEventListener('resize', fit);

// one-finger swipe changes the scene; the click that follows a swipe is ignored
let down = null, swiped = false;
stage.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, type: e.pointerType }; swiped = false; });
stage.addEventListener('pointercancel', () => { down = null; });
stage.addEventListener('pointerup', e => {
  if (!down) return; const d = down; down = null; const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (d.type !== 'mouse' && Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swiped = true; setScene(scene + (dx < 0 ? 1 : -1)); }
});
stage.addEventListener('click', e => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);

renderRecs(); syncPerson(); syncModes(); setScene(1);
document.fonts && document.fonts.ready.then(fit);

window.__what = { scene: () => scene, go: setScene, totals: () => ({ perWordPerPerson: PER_WORD_PER_PERSON, perPerson: PER_PERSON, perWord: PER_WORD, total: TOTAL }) };
})();
</script>
<script src="../_shared/tapstep.js"></script>
</body>
